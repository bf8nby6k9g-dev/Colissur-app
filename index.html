<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColisSûr — Maquette interactive</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3D39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ColisSûr">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EB;
    --card:#FFFFFF;
    --primary:#0E3D39;
    --primary-light:#E3ECE9;
    --accent:#D97706;
    --accent-light:#FBEEDB;
    --success:#2F7D4F;
    --success-light:#E5F2EA;
    --danger:#B23A2E;
    --danger-light:#FAEAE7;
    --text:#17221D;
    --muted:#5F6E67;
    --border:#DBE0D8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:28px 12px;
  }
  .phone{
    width:380px;
    max-width:100%;
    background:var(--card);
    border-radius:28px;
    border:1px solid var(--border);
    box-shadow:0 20px 40px -20px rgba(14,61,57,0.25);
    overflow:hidden;
  }
  .topbar{
    background:var(--primary);
    color:#fff;
    padding:16px 18px 14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:18px;
    margin-bottom:12px;
  }
  .brand .lock{font-size:18px;}
  .roles{
    display:flex;
    background:rgba(255,255,255,0.12);
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .roles button{
    flex:1;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.75);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12.5px;
    padding:8px 6px;
    border-radius:8px;
    cursor:pointer;
  }
  .roles button.active{
    background:#fff;
    color:var(--primary);
  }
  .vault{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    background:var(--primary-light);
  }
  .ring{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex-shrink:0;
    border:2px solid var(--primary);
    background:#fff;
    color:var(--primary);
  }
  .vault-text .stage{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .vault-text .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  #btn-view-balance{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 8px;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px dashed var(--primary);
    background:#fff;
    color:var(--primary);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  #btn-cancel-any{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 8px;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px dashed var(--danger);
    background:#fff;
    color:var(--danger);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  #btn-shortcut-done{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 8px;
    padding:10px 10px;
    border-radius:10px;
    border:none;
    background:var(--success);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .balance-card{
    background:var(--primary);
    color:#fff;
    border-radius:16px;
    padding:20px 18px;
    text-align:center;
    margin-bottom:14px;
  }
  .balance-card .amount{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:700;
    margin:6px 0 2px;
  }
  .balance-card .label{font-size:11.5px;opacity:0.85;letter-spacing:0.3px;text-transform:uppercase;}
  .btn-withdraw-disabled{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:none;
    background:#E2E2DC;
    color:#8a8a80;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:not-allowed;
    margin-top:6px;
  }
  .steps{
    display:flex;
    padding:10px 18px 0;
    gap:4px;
  }
  .step{
    flex:1;height:4px;border-radius:2px;background:var(--border);
  }
  .step.done{background:var(--primary);}
  .step.final-ok{background:var(--success);}
  .step.final-bad{background:var(--danger);}
  .screen{padding:16px 18px 22px;min-height:280px;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:0 0 4px;}
  p.lead{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:12px 0 5px;}
  input,select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--border);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:#fcfcfa;
    color:var(--text);
  }
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  button.primary{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button.primary:active{transform:scale(0.98);}
  button.secondary{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13.5px;
    cursor:pointer;
  }
  .err{color:var(--danger);font-size:12px;margin-top:4px;display:none;}
  .card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    background:#fbfbf9;
  }
  .card .code{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.5px;
    color:var(--primary);
  }
  .card .line{
    display:flex;justify-content:space-between;
    font-size:13px;padding:5px 0;
  }
  .card .line span:first-child{color:var(--muted);}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .badge.wait{background:var(--accent-light);color:#8a4d05;}
  .badge.ok{background:var(--success-light);color:var(--success);}
  .badge.bad{background:var(--danger-light);color:var(--danger);}
  .qr{
    width:104px;height:104px;
    margin:14px auto 6px;
    background:
      linear-gradient(90deg, var(--text) 50%, transparent 50%),
      linear-gradient(var(--text) 50%, transparent 50%);
    background-size:14px 14px;
    border:6px solid #fff;
    outline:1px solid var(--border);
    position:relative;
  }
  .qr::after{
    content:'';
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 18px 18px, transparent 12px, #fff 12.5px),
      radial-gradient(circle at 86px 18px, transparent 12px, #fff 12.5px),
      radial-gradient(circle at 18px 86px, transparent 12px, #fff 12.5px);
  }
  .center{text-align:center;}
  .muted-small{font-size:12px;color:var(--muted);}
  .empty{
    text-align:center;
    padding:30px 10px 10px;
    color:var(--muted);
    font-size:13px;
  }
  .empty .lock{font-size:26px;display:block;margin-bottom:8px;}
  .illustration{
    display:flex;justify-content:center;
    margin:2px 0 14px;
  }
  .illustration svg{width:100%;max-width:190px;height:auto;display:block;}
  .illustration.small svg{max-width:120px;}
  .operator-select{
    display:flex;gap:10px;margin-top:6px;
  }
  .op-btn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 8px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .op-btn .op-dot{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.2px;
  }
  .op-btn.orange .op-dot{background:#FF6A00;}
  .op-btn.mtn .op-dot{background:#FFCB05;color:#1a1a1a;}
  .op-btn .op-label{font-size:11.5px;font-weight:600;color:var(--text);}
  .op-btn.selected{border-color:var(--primary);background:var(--primary-light);}
  .op-btn.selected .op-dot{box-shadow:0 0 0 3px rgba(14,61,57,0.15);}
  .type-select{
    display:flex;gap:8px;margin:6px 0 14px;
  }
  .type-btn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 6px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#fff;
    cursor:pointer;
    text-align:center;
  }
  .type-btn .type-icon{font-size:20px;}
  .type-btn .type-label{font-size:11px;font-weight:600;color:var(--text);line-height:1.2;}
  .type-btn.selected{border-color:var(--primary);background:var(--primary-light);}
  .type-btn.disabled{opacity:0.5;}
  .type-note{
    font-size:11.5px;color:var(--muted);background:#FBF3E3;border-radius:10px;
    padding:8px 10px;margin:-6px 0 12px;
  }  #splash{
    position:fixed;
    inset:0;
    background:var(--primary);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
    transition:opacity 0.5s ease;
  }
  #splash.hide{
    opacity:0;
    pointer-events:none;
  }
  #splash .splash-c{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:110px;
    color:#F3B15C;
    line-height:1;
    animation:splashPop 0.6s ease;
  }
  #splash .splash-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:20px;
    color:#fff;
    margin-top:6px;
    letter-spacing:0.5px;
  }
  #splash .splash-tag{
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:rgba(255,255,255,0.65);
    margin-top:10px;
  }
  @keyframes splashPop{
    0%{ transform:scale(0.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-c">C</div>
  <div class="splash-name">ColisSûr</div>
  <div class="splash-tag">Le tiers de confiance pour ton colis</div>
</div>

<div class="phone">
  <div class="topbar">
    <div class="brand"><span class="lock">&#128274;</span>ColisSûr</div>
    <div class="roles">
      <button id="btn-role-vendeur" class="active">Vendeuse</button>
      <button id="btn-role-client">Client &amp; agent</button>
    </div>
  </div>

  <div class="vault">
    <div class="ring" id="ring">&#128274;</div>
    <div class="vault-text">
      <div class="stage" id="stage-label">Aucune commande</div>
      <div class="sub" id="stage-sub">Crée une commande pour commencer</div>
    </div>
  </div>

  <button id="btn-view-balance" style="display:none;">&#128274; Consulter les fonds en séquestre</button>
  <button id="btn-shortcut-done" style="display:none;">&#9989; La cliente a confirmé — marquer comme terminé</button>
  <button id="btn-cancel-any" style="display:none;">&#10005; Annuler / recommencer cette commande</button>

  <div class="steps" id="steps">
    <div class="step" data-i="0"></div>
    <div class="step" data-i="1"></div>
    <div class="step" data-i="2"></div>
    <div class="step" data-i="3"></div>
  </div>

  <div class="screen" id="screen"></div>
</div>

<script>
// Adresse de ton serveur backend (Render, etc.) une fois déployé.
// Laisse vide pour rester en mode simulation (aucun vrai appel réseau).
// Exemple une fois prêt : 'https://colissur-backend.onrender.com'
var BACKEND_URL = '';

var state = {
  role: 'vendeur',
  order: null,
  draft: { type: 'inter_ville' },
  showBalance: false,
  roleLocked: false,
  fromLink: false,
  vendorMode: null,
  catalogDraft: {},
  catalogBrowse: null
};

var SVG_BOX =
  '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M14 46 L60 18 L106 46 L60 74 Z" fill="#F3B15C"/>' +
    '<path d="M14 46 L60 74 L60 108 L14 84 Z" fill="#D97706"/>' +
    '<path d="M106 46 L60 74 L60 108 L106 84 Z" fill="#B25F04"/>' +
    '<line x1="60" y1="74" x2="60" y2="108" stroke="#8a4d05" stroke-width="3"/>' +
    '<path d="M14 46 L60 18 L106 46" fill="none" stroke="#8a4d05" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="94" cy="92" r="17" fill="#0E3D39"/>' +
    '<path d="M87 92 l5 5 l10 -11" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';

var SVG_HANDOFF =
  '<svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg">' +
    '<circle cx="36" cy="28" r="14" fill="#0E3D39"/>' +
    '<path d="M12 100 Q12 60 36 60 Q60 60 60 100 Z" fill="#0E3D39"/>' +
    '<circle cx="184" cy="28" r="14" fill="#2F7D4F"/>' +
    '<path d="M160 100 Q160 60 184 60 Q208 60 208 100 Z" fill="#2F7D4F"/>' +
    '<path d="M60 80 Q78 80 88 80" stroke="#0E3D39" stroke-width="6" stroke-linecap="round" fill="none"/>' +
    '<path d="M160 80 Q142 80 132 80" stroke="#2F7D4F" stroke-width="6" stroke-linecap="round" fill="none"/>' +
    '<rect x="86" y="62" width="48" height="36" rx="4" fill="#D97706"/>' +
    '<rect x="86" y="62" width="48" height="10" fill="#B25F04"/>' +
    '<line x1="110" y1="62" x2="110" y2="98" stroke="#8a4d05" stroke-width="3"/>' +
  '</svg>';

var SVG_VAULT =
  '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="18" y="46" width="84" height="58" rx="10" fill="#0E3D39"/>' +
    '<rect x="18" y="46" width="84" height="14" rx="7" fill="#155048"/>' +
    '<path d="M40 46 V32 a20 20 0 0 1 40 0 V46" fill="none" stroke="#0E3D39" stroke-width="8"/>' +
    '<circle cx="60" cy="76" r="10" fill="#F3B15C"/>' +
    '<rect x="56" y="80" width="8" height="14" rx="3" fill="#F3B15C"/>' +
  '</svg>';

function illustration(svg, small){
  return '<div class="illustration' + (small ? ' small' : '') + '">' + svg + '</div>';
}

function toBase64Unicode(str){
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  for(var i = 0; i < bytes.length; i++){ binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

function fromBase64Unicode(b64){
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder().decode(bytes);
}

function encodeOrder(o){
  var full = {
    i:o.id, t:o.typeTransaction, p:o.produit, vt:o.vendeurTel,
    ct:o.clientTel, pr:o.prix, f:o.frais, tt:o.total,
    c:o.commission, d:o.depart, a:o.arrivee,
    s:o.statut, pl:o.pointRelais, q:o.qr,
    ac:o.agentCode, cc:o.clientCode,
    af:o.agentConfirmed, cf:o.clientConfirmed, op:o.operateur
  };
  var payload = {};
  for(var key in full){
    if(full[key] !== null && full[key] !== '' && full[key] !== false && full[key] !== undefined){
      payload[key] = full[key];
    }
  }
  return encodeURIComponent(toBase64Unicode(JSON.stringify(payload)));
}

function decodeOrder(str){
  try{
    var payload = JSON.parse(fromBase64Unicode(decodeURIComponent(str)));
    return {
      id: payload.i, typeTransaction: payload.t || 'inter_ville',
      produit: payload.p, vendeurTel: payload.vt || '', clientTel: payload.ct || '',
      prix: payload.pr, frais: payload.f,
      total: payload.tt, commission: payload.c, depart: payload.d, arrivee: payload.a,
      statut: payload.s || 'attente_paiement',
      pointRelais: payload.pl || null, qr: payload.q || null,
      agentCode: payload.ac || null, clientCode: payload.cc || null,
      agentConfirmed: !!payload.af, clientConfirmed: !!payload.cf,
      operateur: payload.op || null
    };
  } catch(e){
    return null;
  }
}

function statusRank(statut){
  var ranks = {
    attente_paiement: 0, confirmation_paiement: 1, gele: 2,
    remise_directe: 3, en_route: 3, arrive: 4, libere: 5, rembourse: 5
  };
  return ranks.hasOwnProperty(statut) ? ranks[statut] : 0;
}

function buildOrderLink(o){
  var base = window.location.href.split('?')[0].split('#')[0];
  return base + '?o=' + encodeOrder(o);
}

function openExternalLink(url){
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function shareOnWhatsApp(o){
  var lien = buildOrderLink(o);
  var texte = 'Bonjour ! Voici ta commande ColisSûr :\n' +
    o.produit + '\n' +
    'Total à payer (produit + frais d\'expédition) : ' + fcfa(o.total) + '\n' +
    'Ton argent reste protégé jusqu\'à ce que tu confirmes avoir reçu ton colis.\n' +
    'Clique ici pour payer en sécurité : ' + lien;
  var url = 'https://wa.me/?text=' + encodeURIComponent(texte);
  openExternalLink(url);
}

function notifyVendeurPaiement(o){
  var texte = '✅ J\'ai payé la commande ' + o.id + ' (' + o.produit + ', ' + fcfa(o.total) + ') sur ColisSûr.\n' +
    (o.typeTransaction === 'meme_ville' ? 'Tu peux me remettre le colis en main propre quand tu veux.' : 'Tu peux procéder à l\'envoi du colis.');
  var url = 'https://wa.me/' + o.vendeurTel + '?text=' + encodeURIComponent(texte);
  openExternalLink(url);
}

function notifyVendeurConfirmation(o, conforme){
  var texte = conforme
    ? '✅ J\'ai bien reçu mon colis (' + o.produit + ', commande ' + o.id + ') et j\'ai confirmé sur ColisSûr — le paiement de ' + fcfa(o.prix - o.commission) + ' t\'a été envoyé.'
    : '❌ Le colis (' + o.produit + ', commande ' + o.id + ') n\'était pas conforme, j\'ai signalé un refus sur ColisSûr. Le colis va repartir vers toi.';
  var url = 'https://wa.me/' + o.vendeurTel + '?text=' + encodeURIComponent(texte);
  openExternalLink(url);
}

function notifyClientEnRoute(o){
  if(!o.clientTel) return;
  var lien = buildOrderLink(o);
  var texte = '📦 Ton colis (' + o.produit + ') vient d\'être envoyé, en route vers ' + o.arrivee + ' !\n' +
    'Suis l\'avancement ici : ' + lien;
  var url = 'https://wa.me/' + o.clientTel + '?text=' + encodeURIComponent(texte);
  openExternalLink(url);
}

function notifyClientArrive(o){
  if(!o.clientTel) return;
  var lien = buildOrderLink(o);
  var texte = '✅ Ton colis (' + o.produit + ') est arrivé à ' + o.pointRelais + ' ! Tu peux venir le récupérer.\n' +
    'Ouvre ce lien pour vérifier et confirmer : ' + lien;
  var url = 'https://wa.me/' + o.clientTel + '?text=' + encodeURIComponent(texte);
  openExternalLink(url);
}

function loadOrderFromLink(){
  var params = new URLSearchParams(window.location.search);
  var o = params.get('o');
  if(!o) return false;
  var decoded = decodeOrder(o);
  if(!decoded) return false;

  var saved = null;
  try{
    var raw = localStorage.getItem('cs_order_' + decoded.id);
    if(raw) saved = JSON.parse(raw);
  } catch(e){}

  if(saved && statusRank(saved.statut) >= statusRank(decoded.statut)){
    state.order = saved;
  } else {
    state.order = decoded;
  }
  state.role = 'client';
  state.fromLink = true;
  persistOrder();
  return true;
}

function loadCatalogFromLink(){
  var params = new URLSearchParams(window.location.search);
  var c = params.get('cat');
  if(!c) return false;
  var cat = decodeCatalog(c);
  if(!cat) return false;
  state.catalogBrowse = cat;
  state.role = 'client';
  return true;
}

function buyFromCatalog(itemId){
  var cat = state.catalogBrowse;
  var item = cat.items.filter(function(it){ return it.id === itemId; })[0];
  if(!item) return;

  var arrivee = cat.depart;
  if(cat.typeTransaction !== 'meme_ville'){
    var saisie = window.prompt('Ta ville de livraison :', '');
    if(!saisie || !saisie.trim()) return;
    arrivee = saisie.trim();
  }

  state.order = {
    id: genCode(),
    typeTransaction: cat.typeTransaction,
    produit: item.nom,
    vendeurTel: cat.vendeurTel,
    clientTel: '',
    prix: item.prix,
    frais: item.frais,
    commission: item.prix * commissionRate(cat.typeTransaction),
    total: item.prix + item.frais,
    depart: cat.depart,
    arrivee: arrivee,
    statut: 'attente_paiement',
    pointRelais: null,
    qr: null,
    agentCode: null,
    clientCode: null,
    agentConfirmed: false,
    clientConfirmed: false,
    operateur: null
  };
  state.catalogBrowse = null;
  state.role = 'client';
  state.fromLink = true;
  lockClientRole();
  persistOrder();
  render();
}

function persistOrder(){
  if(!state.order) return;
  try{
    localStorage.setItem('cs_order_' + state.order.id, JSON.stringify(state.order));
    if(state.role === 'vendeur' && !state.fromLink){
      localStorage.setItem('cs_vendor_active_id', state.order.id);
    }
  } catch(e){}
}

function loadVendorOrder(){
  try{
    var activeId = localStorage.getItem('cs_vendor_active_id');
    if(!activeId) return false;
    var raw = localStorage.getItem('cs_order_' + activeId);
    if(!raw) return false;
    state.order = JSON.parse(raw);
    return true;
  } catch(e){
    return false;
  }
}

function getSavedOrders(){
  var list = [];
  try{
    for(var i = 0; i < localStorage.length; i++){
      var key = localStorage.key(i);
      if(key && key.indexOf('cs_order_') === 0){
        try{ list.push(JSON.parse(localStorage.getItem(key))); } catch(e){}
      }
    }
  } catch(e){}
  return list;
}

function resumeOrder(id){
  try{
    var raw = localStorage.getItem('cs_order_' + id);
    if(!raw) return;
    state.order = JSON.parse(raw);
    state.role = 'client';
    state.fromLink = true;
    lockClientRole();
    render();
  } catch(e){}
}

function statutLabel(statut){
  var map = {
    attente_paiement: 'En attente de paiement',
    confirmation_paiement: 'Confirmation en cours',
    gele: 'Payée — argent gelé',
    remise_directe: 'En attente de ta confirmation',
    en_route: 'Colis en route',
    arrive: 'Colis arrivé — à vérifier',
    libere: 'Terminée — colis reçu',
    rembourse: 'Remboursée',
    expire_vendeur: 'Non récupéré — reversé à la vendeuse',
    expire_client: 'Colis non envoyé — remboursée'
  };
  return map[statut] || statut;
}

function commissionRate(typeTransaction){
  if(typeTransaction === 'meme_ville') return 0.03;
  if(typeTransaction === 'international') return 0.08;
  return 0.05;
}

function fcfa(n){ return Math.round(n).toLocaleString('fr-FR') + ' FCFA'; }
function genCode(){ return 'CS-' + Math.floor(1000 + Math.random()*9000); }

function setRole(r){
  if(state.roleLocked && r === 'vendeur') return;
  state.role = r;
  document.getElementById('btn-role-vendeur').classList.toggle('active', r === 'vendeur');
  document.getElementById('btn-role-client').classList.toggle('active', r === 'client');
  render();
}
document.getElementById('btn-role-vendeur').onclick = function(){ setRole('vendeur'); };
document.getElementById('btn-role-client').onclick = function(){ setRole('client'); };

function updateVault(){
  var ring = document.getElementById('ring');
  var label = document.getElementById('stage-label');
  var sub = document.getElementById('stage-sub');
  var steps = document.querySelectorAll('.step');
  var o = state.order;

  var stageIndex = -1;
  var icon = '&#128274;';
  var text = 'Aucune commande';
  var subtext = 'Crée une commande pour commencer';
  var color = '';

  if(o){
    if(o.statut === 'attente_paiement'){ stageIndex=0; icon='&#128273;'; text='Créée'; subtext='En attente du paiement du client'; }
    else if(o.statut === 'confirmation_paiement'){ stageIndex=0; icon='&#128273;'; text='Confirmation en cours'; subtext='La cliente confirme sur Mobile Money'; }
    else if(o.statut === 'gele'){ stageIndex=1; icon='&#128274;'; text='Gelée'; subtext='Argent en sécurité, en attente de dépôt'; }
    else if(o.statut === 'remise_directe'){ stageIndex=2; icon='&#128274;'; text='Remise directe'; subtext='En attente de vérification par la cliente'; }
    else if(o.statut === 'en_route'){ stageIndex=2; icon='&#128274;'; text='En route'; subtext='Colis en transit vers ' + o.arrivee; }
    else if(o.statut === 'arrive'){
      stageIndex=2; icon='&#128274;';
      if(!o.agentConfirmed){ text='Arrivée'; subtext='En attente de confirmation de l\'agent'; }
      else { text='Remise confirmée'; subtext='En attente de vérification par la cliente'; }
    }
    else if(o.statut === 'libere'){ stageIndex=3; icon='&#128275;'; text='Libérée'; subtext='Paiement envoyé à la vendeuse'; color='ok'; }
    else if(o.statut === 'rembourse'){ stageIndex=3; icon='&#10060;'; text='Remboursée'; subtext='Colis refusé, client remboursé'; color='bad'; }
    else if(o.statut === 'expire_vendeur'){ stageIndex=3; icon='&#9203;'; text='Non récupéré'; subtext='Délai dépassé, fonds reversés à la vendeuse'; color='bad'; }
    else if(o.statut === 'expire_client'){ stageIndex=3; icon='&#9203;'; text='Colis non envoyé'; subtext='Délai dépassé, fonds remboursés à la cliente'; color='bad'; }
  }

  ring.innerHTML = icon;
  ring.style.borderColor = color === 'bad' ? 'var(--danger)' : (color === 'ok' ? 'var(--success)' : 'var(--primary)');
  ring.style.color = color === 'bad' ? 'var(--danger)' : (color === 'ok' ? 'var(--success)' : 'var(--primary)');
  label.textContent = text;
  sub.textContent = subtext;

  steps.forEach(function(s){
    var i = parseInt(s.getAttribute('data-i'));
    s.className = 'step';
    if(i <= stageIndex){
      if(i === 3 && color === 'bad') s.classList.add('final-bad');
      else if(i === 3 && color === 'ok') s.classList.add('final-ok');
      else s.classList.add('done');
    }
  });

  var balanceBtn = document.getElementById('btn-view-balance');
  if(o && fundsFrozen(o.statut)){
    balanceBtn.style.display = 'block';
    balanceBtn.onclick = showBalance;
  } else {
    balanceBtn.style.display = 'none';
  }

  var cancelBtn = document.getElementById('btn-cancel-any');
  var terminalStatuses = ['libere', 'rembourse', 'expire_vendeur', 'expire_client'];
  var paidStatuses = ['gele', 'remise_directe', 'en_route', 'arrive'];

  var shortcutBtn = document.getElementById('btn-shortcut-done');
  if(o && state.role === 'vendeur' && !state.showBalance && paidStatuses.indexOf(o.statut) !== -1){
    shortcutBtn.style.display = 'block';
    shortcutBtn.onclick = function(){
      if(window.confirm('Confirmer que la cliente a bien reçu son colis et validé sur son téléphone ? La transaction va être marquée comme terminée.')){
        markVendeurConfirme(true);
      }
    };
  } else {
    shortcutBtn.style.display = 'none';
  }

  if(o && state.role === 'vendeur' && !state.showBalance && terminalStatuses.indexOf(o.statut) === -1){
    cancelBtn.style.display = 'block';
    cancelBtn.onclick = function(){
      if(window.confirm('Annuler cette commande ? Cette action est irréversible dans cette démo.')){
        state.order = null;
        try{ localStorage.removeItem('cs_vendor_active_id'); } catch(e){}
        render();
      }
    };
  } else {
    cancelBtn.style.display = 'none';
  }
}

function fundsFrozen(statut){
  return statut === 'gele' || statut === 'en_route' || statut === 'arrive' || statut === 'remise_directe';
}

function showBalance(){
  state.showBalance = true;
  render();
}

function hideBalance(){
  state.showBalance = false;
  render();
}

function screen(html){
  document.getElementById('screen').innerHTML = html;
}

function render(){
  if(state.order) checkDeadlineExpired(state.order);
  updateVault();
  persistOrder();
  if(state.showBalance && state.order && fundsFrozen(state.order.statut)){
    renderBalance();
    return;
  }
  if(state.role === 'vendeur') renderVendeur();
  else renderClient();
}

    : 'Cet argent que tu as payé est bloqué en sécurité. Il ne sera versé à la vendeuse que si toi, tu confirmes avoir reçu ton colis conforme. Tant que tu ne confirmes pas, personne — même pas ColisSûr — ne peut le toucher.';
  screen(

    '<p class="muted-small" style="margin-top:8px;">Personne n\'a de bouton "transférer où je veux" sur ce compte — l\'argent ne bouge qu\'automatiquement, selon le statut de la commande.</p>' +
    '<div class="card" style="margin-top:14px;">' +
      '<div class="line" style="display:block;"><span style="font-weight:600;">&#8505;&#65039; Comment ça marche en vrai (une fois connecté à MTN/Orange)</span></div>' +
      '<p class="muted-small" style="margin-top:6px;">Il n\'y a pas un compte séparé par commande. Toutes les clientes envoient vers le <b>même compte marchand ColisSûr</b> — la distinction se fait grâce à la <b>référence unique</b> de chaque commande :</p>' +
      '<div class="line"><span>Référence de cette transaction</span><span class="code">' + o.id + '</span></div>' +
      '<p class="muted-small" style="margin-top:6px;">Une base de données sécurisée garde la trace de qui possède quoi, comme des colis étiquetés dans un même camion. Le transfert final vers la vendeuse se fait automatiquement via cette référence, jamais manuellement.</p>' +

        '<button class="primary" id="mode-marketplace" style="text-align:left;line-height:1.4;margin-top:10px;background:#B25F04;">&#128717;&#65039; Mon catalogue (Marketplace)<br><span style="font-weight:400;font-size:12px;opacity:0.9;">Publier tes produits, que les clientes découvrent</span></button>' +

    screen(

      '</div>' +

      (t === 'international' ? '<p class="type-note">Le commerce entre pays n\'est pas encore pris en charge par ColisSûr — l\'appli se concentre pour l\'instant sur le commerce interurbain au Cameroun.</p>' : '') +
      '<label for="f-produit">Produit</label>' +

    }

  if(o.statut === 'arrive'){

function createOrder(){
  var t = state.draft.type || 'inter_ville';
  var produit = document.getElementById('f-produit').value.trim();
  var vendeurTel = document.getElementById('f-vendeur-tel').value.trim();
  var prix = parseFloat(document.getElementById('f-prix').value);
  var fraisRaw = document.getElementById('f-frais').value;
  var frais = fraisRaw === '' ? NaN : parseFloat(fraisRaw);
  var err = document.getElementById('f-err');
  var depart, arrivee;

  if(t === 'meme_ville'){
    var ville = document.getElementById('f-ville').value.trim();
    depart = ville;
    arrivee = ville;
    if(!produit || !vendeurTel || !prix || prix <= 0 || isNaN(frais) || frais < 0 || !ville){
      err.style.display = 'block';
      return;
    }
  } else {
    depart = document.getElementById('f-depart').value.trim();
    arrivee = document.getElementById('f-arrivee').value.trim();
    if(!produit || !vendeurTel || !prix || prix <= 0 || isNaN(frais) || frais < 0 || !depart || !arrivee){
      err.style.display = 'block';
      return;
    }
  }
  err.style.display = 'none';

  state.order = {
    id: genCode(),
    typeTransaction: t,
    produit: produit,
    vendeurTel: vendeurTel.replace(/[^0-9]/g, ''),
    clientTel: '',
    prix: prix,
    frais: frais,
    commission: prix * commissionRate(t),
    total: prix + frais,
    depart: depart,
    arrivee: arrivee,
    statut: 'attente_paiement',
    pointRelais: null,
    qr: null,
    agentCode: null,
    clientCode: null,
    agentConfirmed: false,
    clientConfirmed: false,
    operateur: null
  };
  saveVendorProfile({ tel: state.order.vendeurTel, boutique: (getVendorProfile() || {}).boutique || '' });
  addToVendorHistory(state.order.id);
  state.draft = { type: 'inter_ville' };
  render();
}

function addToVendorHistory(id){
  try{
    var ids = JSON.parse(localStorage.getItem('cs_vendor_order_ids') || '[]');
    if(ids.indexOf(id) === -1){
      ids.unshift(id);
      localStorage.setItem('cs_vendor_order_ids', JSON.stringify(ids));
    }
  } catch(e){}
}
function getVendorHistory(){
  try{
    var ids = JSON.parse(localStorage.getItem('cs_vendor_order_ids') || '[]');
    return ids.map(function(id){
      try{ return JSON.parse(localStorage.getItem('cs_order_' + id)); }
      catch(e){ return null; }

  } catch(e){ return []; }

function getCatalog(){

function saveCatalog(cat){
  try{ localStorage.setItem('cs_catalog', JSON.stringify(cat)); }
  catch(e){}
}
function encodeCatalog(cat){
  var payload = {
    vt: cat.vendeurTel, d: cat.depart, t: cat.typeTransaction, b: cat.boutique,
    items: cat.items.map(function(it){ return { i: it.id, n: it.nom, p: it.prix, f: it.frais }; })
  };
  return encodeURIComponent(toBase64Unicode(JSON.stringify(payload)));
}
function decodeCatalog(str){
  try{
    var payload = JSON.parse(fromBase64Unicode(decodeURIComponent(str)));
    return {
      vendeurTel: payload.vt || '', depart: payload.d || '', typeTransaction: payload.t || 'inter_ville',
      boutique: payload.b || 'Boutique ColisSûr',
      items: (payload.items || []).map(function(it){
        return { id: it.i, nom: it.n, prix: it.p, frais: it.f };
      })
    };
  } catch(e){ return null; }
}
function buildCatalogLink(cat){
  var base = window.location.href.split('?')[0].split('#')[0];
  return base + '?cat=' + encodeCatalog(cat);
}
function shareCatalog(){

    'Paiement sécurisé, argent bloqué jusqu\'à réception de ton colis.\n\n' +

// ============================================================
// POINTS D'ACCROCHE API DE PAIEMENT (CamPay ou équivalent)
// ============================================================
// IMPORTANT : ces deux fonctions ne font AUCUN vrai appel réseau.
// Une clé API ne doit JAMAIS être mise dans du code qui tourne sur
// le téléphone du client — n'importe qui peut l'extraire en ouvrant
// le code source. Ces appels doivent partir de TON PROPRE SERVEUR,
// qui lui seul connaît la clé secrète, jamais du téléphone.
//
// Le flux réel serait :
// Téléphone → ton serveur (sans clé exposée) → API CamPay (avec la clé)
//
// Ci-dessous, la forme exacte des appels CamPay (vérifiée dans leur
// documentation), à titre de modèle pour toi ou un développeur plus tard.

function notifyEscrowCollecte(o){
  if(!BACKEND_URL){
    console.log('[Simulation] Signal envoyé : encaisser ' + o.total + ' FCFA, référence ' + o.id);
    return;
  }
  fetch(BACKEND_URL + '/api/collect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      amount: o.total,
      phone: o.clientTel,
      description: 'ColisSur ' + o.produit,
      reference: o.id
    })
  }).then(function(res){ return res.json(); })
    .then(function(data){ console.log('Collecte CamPay :', data); })
    .catch(function(err){ console.error('Erreur collecte CamPay :', err); });
}

function notifyEscrowLibere(o){
  var net = o.prix - o.commission;
  if(!BACKEND_URL){
    console.log('[Simulation] Signal envoyé : reverser ' + net + ' FCFA à ' + o.vendeurTel + ', référence ' + o.id);
    return;
  }
  fetch(BACKEND_URL + '/api/release', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      amount: net,
      phone: o.vendeurTel,
      description: 'Paiement colis ' + o.produit,
      reference: o.id
    })
  }).then(function(res){ return res.json(); })
    .then(function(data){ console.log('Libération CamPay :', data); })
    .catch(function(err){ console.error('Erreur libération CamPay :', err); });
}

function bindCancel(){
  var b = document.getElementById('btn-cancel');
  if(b) b.onclick = function(){ state.order = null; render(); };
}

function depositPackage(){
  var relais = document.getElementById('f-relais').value.trim();
  var err = document.getElementById('f-relais-err');
  if(!relais){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  state.order.pointRelais = relais;
  state.order.statut = 'en_route';
  if(state.order.clientTel){
    notifyClientEnRoute(state.order);
  }
  render();
}

function remiseDirecte(){
  state.order.clientCode = String(Math.floor(1000 + Math.random()*9000));
  state.order.agentConfirmed = true;
  state.order.statut = 'remise_directe';
  render();
}

function markArrived(){
  state.order.qr = 'QR-' + Math.floor(100000 + Math.random()*900000);
  state.order.agentCode = String(Math.floor(1000 + Math.random()*9000));
  state.order.clientCode = String(Math.floor(1000 + Math.random()*9000));
  state.order.statut = 'arrive';
  state.order.deadline = Date.now() + (3 * 24 * 60 * 60 * 1000);
  if(state.order.clientTel){
    notifyClientArrive(state.order);
  }
  render();
}

function checkDeadlineExpired(o){
  if(o.statut === 'arrive' && o.deadline && Date.now() > o.deadline && !o.clientConfirmed){
    o.statut = 'expire_vendeur';
    persistOrder();
    return true;
  }
  if(o.statut === 'gele' && o.deadlineDepot && Date.now() > o.deadlineDepot){
    o.statut = 'expire_client';
    persistOrder();
    return true;
  }
  return false;
}

function markPaiementRecu(){
  if(!state.order.clientTel){
    var tel = window.prompt('Numéro WhatsApp de la cliente (pour pouvoir la prévenir aux prochaines étapes) :', '');
    if(tel && tel.trim()){
      state.order.clientTel = tel.trim().replace(/[^0-9]/g, '');
    }
  }
  state.order.statut = 'gele';
  state.order.deadlineDepot = Date.now() + (1 * 24 * 60 * 60 * 1000);
  notifyEscrowCollecte(state.order);
  render();
}

function markVendeurConfirme(conforme){
  state.order.statut = conforme ? 'libere' : 'rembourse';
  if(conforme) notifyEscrowLibere(state.order);
  render();
}

function newOrder(){
  state.order = null;
  state.draft = { type: 'inter_ville' };
  try{ localStorage.removeItem('cs_vendor_active_id'); } catch(e){}
  render();
}

function renderCatalogBrowse(){
  var cat = state.catalogBrowse;
  var itemsHtml = cat.items.length ? cat.items.map(function(it){
    return '<div class="card">' +
      '<div class="line"><span><b>' + it.nom + '</b></span><span>' + fcfa(it.prix + it.frais) + '</span></div>' +
      '<div class="line"><span class="muted-small">Produit ' + fcfa(it.prix) + ' + frais ' + fcfa(it.frais) + '</span></div>' +
      '<button class="primary" style="margin-top:8px;" data-buy="' + it.id + '">Acheter en sécurité</button>' +
    '</div>';
  }).join('') : '<div class="empty">Ce catalogue est vide pour le moment.</div>';

  screen(
    illustration(SVG_BOX, true) +
    '<h2>' + cat.boutique + '</h2>' +
    '<p class="lead">' + (cat.typeTransaction === 'meme_ville' ? 'Vente et livraison à ' + cat.depart : 'Expédié depuis ' + cat.depart) + '. Paiement sécurisé, argent bloqué jusqu\'à ta confirmation de réception.</p>' +
    itemsHtml
  );
  document.querySelectorAll('#screen [data-buy]').forEach(function(btn){
    btn.onclick = function(){ buyFromCatalog(btn.getAttribute('data-buy')); };
  });
}

function renderClient(){
  var o = state.order;

  if(!o && state.catalogBrowse){
    renderCatalogBrowse();
    return;
  }

  if(!o){
    var saved = getSavedOrders();
    if(saved.length){
      var cards = saved.map(function(s){
        return '<div class="card" style="cursor:pointer;" data-id="' + s.id + '">' +
          '<div class="line"><span>' + s.produit + '</span><span class="code">' + s.id + '</span></div>' +
          '<div class="line"><span>' + statutLabel(s.statut) + '</span><span>' + fcfa(s.total) + '</span></div>' +
        '</div>';
      }).join('');
      screen(
        illustration(SVG_BOX, true) +
        '<h2>Tes commandes</h2>' +
        '<p class="lead">Tu as perdu le lien WhatsApp ? Pas de souci, tes commandes sur ce téléphone restent accessibles ici.</p>' +
        cards
      );
      var cardEls = document.querySelectorAll('#screen .card[data-id]');
      cardEls.forEach(function(el){
        el.onclick = function(){ resumeOrder(el.getAttribute('data-id')); };
      });
      return;
    }
    screen(
      illustration(SVG_BOX, true) +
      '<div class="empty">Aucune commande active pour le moment.<br>Demande à la vendeuse de créer une commande depuis l\'onglet « Vendeuse ».</div>'
    );
    return;
  }

  if(o.statut === 'attente_paiement'){
    screen(
      '<span class="badge wait">Paiement demandé</span>' +
      '<h2>Payer cette commande</h2>' +
      '<p class="lead">Ton argent ne sera pas versé directement à la vendeuse : il reste gelé chez ColisSûr jusqu\'à ce que tu confirmes avoir reçu ton colis en bon état. Le montant inclut le prix du produit et les frais d\'expédition.</p>' +
      orderCard(o) +
      '<label>Opérateur Mobile Money</label>' +
      '<div class="operator-select">' +
        '<div class="op-btn orange' + (o.operateur === 'orange' ? ' selected' : '') + '" id="op-orange"><div class="op-dot">OM</div><span class="op-label">Orange Money</span></div>' +
        '<div class="op-btn mtn' + (o.operateur === 'mtn' ? ' selected' : '') + '" id="op-mtn"><div class="op-dot">MoMo</div><span class="op-label">MTN MoMo</span></div>' +
      '</div>' +
      '<div class="err" id="f-op-err">Choisis un opérateur pour continuer.</div>' +
      '<label for="f-tel">Numéro Mobile Money</label>' +
      '<input id="f-tel" placeholder="6XX XXX XXX" value="' + (o.telDraft || '') + '">' +
      '<div class="err" id="f-tel-err">Indique un numéro pour payer.</div>' +
      '<label for="f-client-tel">Ton numéro WhatsApp (pour être prévenue de l\'avancement du colis)</label>' +
      '<input id="f-client-tel" placeholder="237 6XX XXX XXX" value="' + (o.clientTel || '') + '">' +
      '<div class="err" id="f-client-tel-err">Indique ton numéro WhatsApp pour continuer.</div>' +
      '<button class="primary" id="btn-pay">Payer ' + fcfa(o.total) + '</button>'
    );
    document.getElementById('op-orange').onclick = function(){ selectOperator('orange'); };
    document.getElementById('op-mtn').onclick = function(){ selectOperator('mtn'); };
    document.getElementById('btn-pay').onclick = payOrder;
    return;
  }

  if(o.statut === 'confirmation_paiement'){
    var opLabel = o.operateur === 'orange' ? 'Orange Money' : 'MTN MoMo';
    var opColor = o.operateur === 'orange' ? '#FF6A00' : '#FFCB05';
    screen(
      '<div class="center" style="margin:8px 0 18px;">' +
        '<div style="width:56px;height:56px;border-radius:50%;background:' + opColor + ';display:flex;align-items:center;justify-content:center;margin:0 auto 10px;color:#fff;font-family:\'Space Grotesk\',sans-serif;font-weight:700;">' + (o.operateur === 'orange' ? 'OM' : 'MoMo') + '</div>' +
      '</div>' +
      '<h2 style="text-align:center;">Confirme sur ' + opLabel + '</h2>' +
      '<p class="lead" style="text-align:center;">Entre ton code secret ' + opLabel + ' pour autoriser le paiement de <b>' + fcfa(o.total) + '</b> vers le compte gelé ColisSûr.</p>' +
      '<label for="f-pin">Code secret (4 chiffres)</label>' +
      '<input id="f-pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••">' +
      '<div class="err" id="f-pin-err">Entre un code à 4 chiffres pour continuer.</div>' +
      '<button class="primary" id="btn-confirm-pin">Confirmer le paiement</button>' +
      '<p class="muted-small" style="margin-top:8px;text-align:center;">Simulation — n\'importe quel code à 4 chiffres fonctionne dans cette démo.</p>'
    );
    document.getElementById('btn-confirm-pin').onclick = confirmPinPayment;
    return;
  }

  if(o.statut === 'gele'){
    screen(
      illustration(SVG_VAULT, true) +
      '<span class="badge ok">Argent gelé &#128274;</span>' +
      '<h2>Paiement en sécurité</h2>' +
      '<p class="lead">Ton argent est bloqué et protégé. Rien ne peut être versé à la vendeuse tant que tu n\'as pas vérifié le colis. ' + (o.typeTransaction === 'meme_ville' ? 'En attente que la vendeuse te remette le colis en main propre.' : 'En attente que la vendeuse dépose le colis au point relais.') + '</p>' +
      orderCard(o) +
      (o.vendeurTel ? '<button class="primary" id="btn-notify-vendeur" style="background:#25D366;margin-top:6px;">&#128241; Prévenir la vendeuse que j\'ai payé</button>' : '')
    );
    if(o.vendeurTel){
      document.getElementById('btn-notify-vendeur').onclick = function(){ notifyVendeurPaiement(o); };
    }
    return;
  }

  if(o.statut === 'remise_directe'){
    screen(
      '<span class="badge wait">Vérifie ton colis</span>' +
      '<h2>La vendeuse t\'a remis le colis</h2>' +
      '<p class="lead">Vérifie le colis devant elle, puis saisis le code que tu as reçu par SMS pour confirmer si le produit est conforme.</p>' +
      orderCard(o) +
      '<label for="f-code-client">Code client</label>' +
      '<input id="f-code-client" inputmode="numeric" maxlength="4" placeholder="4 chiffres" value="' + o.clientCode + '">' +
      '<div class="err" id="f-code-client-err">Code incorrect. Vérifie le code reçu par SMS.</div>' +
      '<p class="lead" style="margin-top:10px;">Colis identifié : <b>' + o.produit + '</b>. Est-il conforme à la description ?</p>' +
      '<button class="primary" id="btn-conforme" style="background:var(--success);">&#10003; Conforme — libérer le paiement</button>' +
      '<button class="primary" id="btn-refuse" style="background:var(--danger);">&#10005; Non conforme — rembourser</button>' +
      '<p class="muted-small" style="margin-top:10px;">Ton code de confirmation est déjà rempli ci-dessus (reçu automatiquement avec ce lien).</p>'
    );
    document.getElementById('btn-conforme').onclick = markConform;
    document.getElementById('btn-refuse').onclick = markRefused;
    return;
  }

  if(o.statut === 'en_route'){
    screen(
      illustration(SVG_BOX, true) +
      '<span class="badge wait">Colis en route</span>' +
      '<h2>Le colis arrive...</h2>' +
      '<p class="lead">La vendeuse a envoyé le colis depuis ' + o.pointRelais + '. Il est en transit vers ' + o.arrivee + ' — pas encore disponible pour retrait.</p>' +
      orderCard(o) +
      '<button class="primary" id="btn-arrived">Agent : signaler l\'arrivée du colis</button>' +
      '<p class="muted-small" style="margin-top:8px;">Cette étape simule le moment où l\'agent du point relais de destination reçoit le colis et l\'enregistre dans l\'appli.</p>'
    );
    document.getElementById('btn-arrived').onclick = markArrived;
    return;
  }

  if(o.statut === 'arrive' && !o.agentConfirmed){
    screen(
      '<span class="badge ok">Colis arrivé &#9989;</span>' +
      '<h2>Étape 1/2 — Confirmation agent</h2>' +
      '<p class="lead">Le colis est arrivé chez ' + o.pointRelais + '. La cliente et l\'agent ont chacun reçu un code par SMS pour confirmer. L\'agent doit saisir le sien d\'abord.</p>' +
      orderCard(o) +
      (o.clientTel ? '<p class="muted-small" style="margin-bottom:8px;">&#9989; Message WhatsApp envoyé automatiquement à la cliente.</p><button class="primary" id="btn-notify-client-arrive" style="background:#25D366;margin-bottom:10px;">&#128241; Renvoyer le message à la cliente</button>' : '') +
      '<label for="f-code-agent">Code agent (reçu par l\'agent)</label>' +
      '<input id="f-code-agent" inputmode="numeric" maxlength="4" placeholder="4 chiffres">' +
      '<div class="err" id="f-code-agent-err">Code incorrect. Vérifie le code reçu par SMS.</div>' +
      '<button class="primary" id="btn-confirm-agent">Confirmer la remise (agent)</button>' +
      '<p class="muted-small" style="margin-top:10px;">Pour la démo, le code agent est : <b>' + o.agentCode + '</b></p>'
    );
    if(o.clientTel){
      document.getElementById('btn-notify-client-arrive').onclick = function(){ notifyClientArrive(o); };
    }
    document.getElementById('btn-confirm-agent').onclick = confirmAgentCode;
    return;
  }

  if(o.statut === 'arrive' && o.agentConfirmed){
    screen(
      '<span class="badge wait">Étape 2/2 — Confirmation client</span>' +
      '<h2>Vérifie ton colis</h2>' +
      '<p class="lead">L\'agent a confirmé la remise. Ouvre le colis devant lui, puis saisis le code que tu as reçu par SMS pour confirmer si le produit est conforme.</p>' +
      orderCard(o) +
      '<div class="center"><div class="qr"></div></div>' +
      '<label for="f-photo">Photo de l\'ouverture du colis (recommandé)</label>' +
      '<input id="f-photo" type="file" accept="image/*" capture="environment">' +
      '<div id="photo-preview"></div>' +
      '<label for="f-code-client">Code client</label>' +
      '<input id="f-code-client" inputmode="numeric" maxlength="4" placeholder="4 chiffres" value="' + o.clientCode + '">' +
      '<div class="err" id="f-code-client-err">Code incorrect. Vérifie le code reçu par SMS.</div>' +
      '<p class="lead" style="margin-top:10px;">Colis identifié : <b>' + o.produit + '</b>. Est-il conforme à la description ?</p>' +
      '<button class="primary" id="btn-conforme" style="background:var(--success);">&#10003; Conforme — libérer le paiement</button>' +
      '<button class="primary" id="btn-refuse" style="background:var(--danger);">&#10005; Non conforme — rembourser</button>' +
      '<p class="muted-small" style="margin-top:10px;">Ton code de confirmation est déjà rempli ci-dessus (reçu automatiquement avec ce lien).</p>'
    );
    document.getElementById('f-photo').onchange = handlePhotoCapture;
    document.getElementById('btn-conforme').onclick = markConform;
    document.getElementById('btn-refuse').onclick = markRefused;
    return;
  }

  if(o.statut === 'libere'){
    screen(
      illustration(SVG_HANDOFF) +
      '<span class="badge ok">Colis reçu et confirmé</span>' +
      '<h2>Transaction terminée</h2>' +
      '<p class="lead">Tu as confirmé la conformité du colis. Le paiement a été envoyé à la vendeuse par Mobile Money' + (o.operateur === 'orange' ? ' (Orange Money)' : o.operateur === 'mtn' ? ' (MTN MoMo)' : '') + '.</p>' +
      (o.vendeurTel ? '<button class="primary" id="btn-notify-vendeur-recu" style="background:#25D366;margin-top:10px;">&#128241; Prévenir la vendeuse que tout est confirmé</button>' : '')
    );
    if(o.vendeurTel){
      document.getElementById('btn-notify-vendeur-recu').onclick = function(){ notifyVendeurConfirmation(o, true); };
    }
    return;
  }

  if(o.statut === 'rembourse'){
    var remboursementClient = Math.max(0, o.total - o.frais);
    screen(
      '<span class="badge bad">Colis refusé</span>' +
      '<h2>Tu as été remboursée</h2>' +
      '<p class="lead">Le colis repart chez la vendeuse ; les frais d\'expédition couvrent l\'aller-retour et ne sont pas remboursés. Voici le détail :</p>' +
      '<div class="card">' +
        '<div class="line"><span>Prix du produit</span><span>' + fcfa(o.prix) + '</span></div>' +
        '<div class="line"><span>Frais d\'expédition (aller-retour, non remboursés)</span><span>-' + fcfa(o.frais) + '</span></div>' +
        '<div class="line"><span><b>Total remboursé</b></span><span><b>' + fcfa(remboursementClient) + '</b></span></div>' +
      '</div>' +
      (o.vendeurTel ? '<button class="primary" id="btn-notify-vendeur-refus" style="background:#25D366;margin-top:10px;">&#128241; Prévenir la vendeuse du refus</button>' : '')
    );
    if(o.vendeurTel){
      document.getElementById('btn-notify-vendeur-refus').onclick = function(){ notifyVendeurConfirmation(o, false); };
    }
    return;
  }

  if(o.statut === 'expire_vendeur'){
    screen(
      '<span class="badge bad">&#9203; Délai de retrait dépassé</span>' +
      '<h2>Tu n\'as pas récupéré ton colis à temps</h2>' +
      '<p class="lead">Plus de 3 jours se sont écoulés depuis l\'arrivée du colis à ' + o.pointRelais + '. Les fonds ont été automatiquement reversés à la vendeuse. Contacte-la directement pour organiser une récupération tardive de ton colis.</p>'
    );
    return;
  }

  if(o.statut === 'expire_client'){
    screen(
      '<span class="badge ok">&#9203; Colis jamais envoyé</span>' +
      '<h2>Tu as été remboursée</h2>' +
      '<p class="lead">La vendeuse n\'a pas déposé le colis dans les 24h suivant ton paiement. Les ' + fcfa(o.total) + ' t\'ont été automatiquement rendus.</p>'
    );
    return;
  }
}

function selectOperator(op){
  var telInput = document.getElementById('f-tel');
  if(telInput) state.order.telDraft = telInput.value;
  state.order.operateur = op;
  render();
}

function payOrder(){
  var tel = document.getElementById('f-tel').value.trim();
  var clientTel = document.getElementById('f-client-tel').value.trim();
  var telErr = document.getElementById('f-tel-err');
  var opErr = document.getElementById('f-op-err');
  var clientTelErr = document.getElementById('f-client-tel-err');
  var ok = true;
  if(!state.order.operateur){
    opErr.style.display = 'block';
    ok = false;
  } else {
    opErr.style.display = 'none';
  }
  if(!tel){
    telErr.style.display = 'block';
    ok = false;
  } else {
    telErr.style.display = 'none';
  }
  if(!clientTel){
    clientTelErr.style.display = 'block';
    ok = false;
  } else {
    clientTelErr.style.display = 'none';
  }
  if(!ok) return;
  state.order.telDraft = tel;
  state.order.clientTel = clientTel.replace(/[^0-9]/g, '');
  state.order.statut = 'confirmation_paiement';
  render();
}

function confirmPinPayment(){
  var pin = document.getElementById('f-pin').value.trim();
  var err = document.getElementById('f-pin-err');
  if(pin.length < 4){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  state.order.statut = 'gele';
  state.order.deadlineDepot = Date.now() + (1 * 24 * 60 * 60 * 1000);
  notifyEscrowCollecte(state.order);
  render();
}

function confirmAgentCode(){
  var input = document.getElementById('f-code-agent').value.trim();
  var err = document.getElementById('f-code-agent-err');
  if(input !== state.order.agentCode){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  state.order.agentConfirmed = true;
  render();
}

function handlePhotoCapture(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    state.photoDraft = ev.target.result;
    var preview = document.getElementById('photo-preview');
    if(preview){
      preview.innerHTML = '<img src="' + ev.target.result + '" style="width:100%;border-radius:12px;margin:8px 0;" alt="Photo du colis">';
    }
  };
  reader.readAsDataURL(file);
}

function checkClientCode(){
  var input = document.getElementById('f-code-client').value.trim();
  var err = document.getElementById('f-code-client-err');
  if(input !== state.order.clientCode){
    err.style.display = 'block';
    return false;
  }
  err.style.display = 'none';
  return true;
}

function markConform(){
  if(!checkClientCode()) return;
  state.order.clientConfirmed = true;
  if(state.photoDraft) state.order.photoColis = state.photoDraft;
  state.order.statut = 'libere';
  notifyEscrowLibere(state.order);
  render();
}

function markRefused(){
  if(!checkClientCode()) return;
  state.order.clientConfirmed = true;
  if(state.photoDraft) state.order.photoColis = state.photoDraft;
  state.order.statut = 'rembourse';
  render();
}

function lockClientRole(){
  state.roleLocked = true;
  var btnV = document.getElementById('btn-role-vendeur');
  if(btnV) btnV.style.display = 'none';
  var btnC = document.getElementById('btn-role-client');
  if(btnC) btnC.classList.add('active');
}

function lockVendorRole(){
  var btnC = document.getElementById('btn-role-client');
  if(btnC) btnC.style.display = 'none';
}

var urlParams = new URLSearchParams(window.location.search);
var testMode = urlParams.get('test') === '1';

var arrivedFromLink = loadOrderFromLink();
if(arrivedFromLink){
  lockClientRole();
} else if(loadCatalogFromLink()){
  lockClientRole();
} else {
  loadVendorOrder();
  if(!testMode) lockVendorRole();
}
render();

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(function(reg){
      reg.update();
    }).catch(function(){});
  });
}

setTimeout(function(){
  var splash = document.getElementById('splash');
  splash.classList.add('hide');
  setTimeout(function(){ splash.style.display = 'none'; }, 500);
}, 1200);
</script>
</body>
</html>
