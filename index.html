<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ColisSûr</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3D39">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ColisSûr">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1EB;
    --card:#FFFFFF;
    --primary:#0E3D39;
    --primary-dark:#092A27;
    --primary-light:#E3ECE9;
    --accent:#C17D1F;
    --accent-deep:#A5680F;
    --accent-light:#FBEEDB;
    --success:#2F7D4F;
    --success-light:#E5F2EA;
    --danger:#B23A2E;
    --danger-light:#FAEAE7;
    --text:#17221D;
    --muted:#5F6E67;
    --border:#DBE0D8;
    --radius:14px;
    --ease:cubic-bezier(.22,1,.36,1);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    width:100%;
    margin:0;
    padding:0;
    overflow-x:hidden;
    overscroll-behavior-y:none;
  }
  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .phone{
    width:100%;
    min-height:100%;
    background:var(--card);
    display:flex;
    flex-direction:column;
  }
  .topbar{
    background:var(--primary);
    background-image:linear-gradient(165deg, var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    padding:calc(14px + var(--safe-top)) 18px 14px;
    position:sticky;
    top:0;
    z-index:40;
    transition:padding .35s var(--ease), box-shadow .35s var(--ease);
  }
  .topbar.compact{
    padding-top:calc(8px + var(--safe-top));
    padding-bottom:9px;
    box-shadow:0 12px 24px -16px rgba(0,0,0,0.45);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:18px;
    margin-bottom:12px;
  }
  .brand .lock{font-size:18px;}
  .roles{
    display:flex;
    background:rgba(255,255,255,0.12);
    border-radius:10px;
    padding:3px;
    gap:3px;
  }
  .roles button{
    flex:1;
    border:none;
    background:transparent;
    color:rgba(255,255,255,0.75);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12.5px;
    padding:8px 6px;
    border-radius:8px;
    cursor:pointer;
  }
  .roles button.active{
    background:#fff;
    color:var(--primary);
  }
  .topbar-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .topbar-row .brand{margin-bottom:0;}
  #btn-menu{
    width:34px;height:34px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    color:#fff;
    font-size:18px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .2s var(--ease), transform .15s var(--ease);
  }
  #btn-menu:active{transform:scale(0.9);}
  #menu-overlay{
    position:fixed;inset:0;
    background:rgba(10,20,18,0.35);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s var(--ease);
  }
  #menu-overlay.open{opacity:1;pointer-events:auto;}
  #menu-sheet{
    position:fixed;
    right:10px;
    top:calc(10px + var(--safe-top));
    background:#fff;
    border-radius:16px;
    box-shadow:0 20px 48px -12px rgba(9,42,39,0.4);
    overflow:hidden;
    z-index:61;
    min-width:208px;
    transform:translateY(-8px) scale(0.96);
    opacity:0;
    pointer-events:none;
    transition:transform .22s var(--ease), opacity .2s var(--ease);
  }
  #menu-sheet.open{
    transform:translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }
  #menu-sheet button{
    display:flex;align-items:center;gap:10px;
    width:100%;
    padding:13px 16px;
    border:none;border-bottom:1px solid var(--border);
    background:#fff;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--text);
    text-align:left;
    cursor:pointer;
  }
  #menu-sheet button:last-child{border-bottom:none;}
  #menu-sheet button:active{background:var(--primary-light);}
  #menu-sheet .menu-icon{font-size:16px;width:18px;text-align:center;}
  .vault{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 18px;
    border-bottom:1px solid var(--border);
    background:var(--primary-light);
  }
  .ring{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:19px;
    flex-shrink:0;
    border:2px solid var(--primary);
    background:#fff;
    color:var(--primary);
  }
  .vault-text .stage{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .vault-text .sub{font-size:12px;color:var(--muted);margin-top:1px;}
  #btn-view-balance{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 8px;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px dashed var(--primary);
    background:#fff;
    color:var(--primary);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  #btn-cancel-any{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 8px;
    padding:9px 10px;
    border-radius:10px;
    border:1.5px dashed var(--danger);
    background:#fff;
    color:var(--danger);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  #btn-shortcut-done{
    display:block;
    width:calc(100% - 36px);
    margin:0 18px 8px;
    padding:10px 10px;
    border-radius:10px;
    border:none;
    background:var(--success);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .balance-card{
    background:var(--primary);
    color:#fff;
    border-radius:16px;
    padding:20px 18px;
    text-align:center;
    margin-bottom:14px;
  }
  .balance-card .amount{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:700;
    margin:6px 0 2px;
  }
  .balance-card .label{font-size:11.5px;opacity:0.85;letter-spacing:0.3px;text-transform:uppercase;}
  .btn-withdraw-disabled{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:none;
    background:#E2E2DC;
    color:#8a8a80;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:not-allowed;
    margin-top:6px;
  }
  .steps{
    display:flex;
    padding:10px 18px 0;
    gap:4px;
  }
  .step{
    flex:1;height:4px;border-radius:2px;background:var(--border);
  }
  .step.done{background:var(--primary);}
  .step.final-ok{background:var(--success);}
  .step.final-bad{background:var(--danger);}
  .screen{padding:16px 18px 22px;min-height:280px;}
  h2{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;margin:0 0 4px;}
  p.lead{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5;}
  label{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:12px 0 5px;}
  input,select{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--border);
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    background:#fcfcfa;
    color:var(--text);
  }
  input:focus,select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .row2{display:flex;gap:10px;}
  .row2 > div{flex:1;}
  button.primary{
    width:100%;
    margin-top:18px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button.primary:active{transform:scale(0.98);}
  button.secondary{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13.5px;
    cursor:pointer;
  }
  .err{color:var(--danger);font-size:12px;margin-top:4px;display:none;}
  .card{
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    background:#fbfbf9;
  }
  .card .code{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.5px;
    color:var(--primary);
  }
  .card .line{
    display:flex;justify-content:space-between;
    font-size:13px;padding:5px 0;
  }
  .card .line span:first-child{color:var(--muted);}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .badge.wait{background:var(--accent-light);color:#8a4d05;}
  .badge.ok{background:var(--success-light);color:var(--success);}
  .badge.bad{background:var(--danger-light);color:var(--danger);}
  .qr{
    width:104px;height:104px;
    margin:14px auto 6px;
    background:
      linear-gradient(90deg, var(--text) 50%, transparent 50%),
      linear-gradient(var(--text) 50%, transparent 50%);
    background-size:14px 14px;
    border:6px solid #fff;
    outline:1px solid var(--border);
    position:relative;
  }
  .qr::after{
    content:'';
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 18px 18px, transparent 12px, #fff 12.5px),
      radial-gradient(circle at 86px 18px, transparent 12px, #fff 12.5px),
      radial-gradient(circle at 18px 86px, transparent 12px, #fff 12.5px);
  }
  .center{text-align:center;}
  .muted-small{font-size:12px;color:var(--muted);}
  .empty{
    text-align:center;
    padding:30px 10px 10px;
    color:var(--muted);
    font-size:13px;
  }
  .empty .lock{font-size:26px;display:block;margin-bottom:8px;}
  .illustration{
    display:flex;justify-content:center;
    margin:2px 0 14px;
  }
  .illustration svg{width:100%;max-width:190px;height:auto;display:block;}
  .illustration.small svg{max-width:120px;}
  .operator-select{
    display:flex;gap:10px;margin-top:6px;
  }
  .op-btn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:12px 8px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .op-btn .op-dot{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:0.2px;
  }
  .op-btn.orange .op-dot{background:#FF6A00;}
  .op-btn.mtn .op-dot{background:#FFCB05;color:#1a1a1a;}
  .op-btn .op-label{font-size:11.5px;font-weight:600;color:var(--text);}
  .op-btn.selected{border-color:var(--primary);background:var(--primary-light);}
  .op-btn.selected .op-dot{box-shadow:0 0 0 3px rgba(14,61,57,0.15);}
  .type-select{
    display:flex;gap:8px;margin:6px 0 14px;
  }
  .type-btn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:10px 6px;
    border-radius:12px;
    border:2px solid var(--border);
    background:#fff;
    cursor:pointer;
    text-align:center;
  }
  .type-btn .type-icon{font-size:20px;}
  .type-btn .type-label{font-size:11px;font-weight:600;color:var(--text);line-height:1.2;}
  .type-btn.selected{border-color:var(--primary);background:var(--primary-light);}
  .type-btn.disabled{opacity:0.5;}
  .type-note{
    font-size:11.5px;color:var(--muted);background:#FBF3E3;border-radius:10px;
    padding:8px 10px;margin:-6px 0 12px;
  }  #splash{
    position:fixed;
    inset:0;
    background:var(--primary);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:9999;
    transition:opacity 0.5s ease;
  }
  #splash.hide{
    opacity:0;
    pointer-events:none;
  }
  #splash .splash-c{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:110px;
    color:#F3B15C;
    line-height:1;
    animation:splashPop 0.6s ease;
  }
  #splash .splash-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:20px;
    color:#fff;
    margin-top:6px;
    letter-spacing:0.5px;
  }
  #splash .splash-tag{
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    color:rgba(255,255,255,0.65);
    margin-top:10px;
  }
  @keyframes splashPop{
    0%{ transform:scale(0.6); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  /* ---- Bottom sheet modal (Profil / Paramètres / Aide) ---- */
  #modal-overlay{
    position:fixed;inset:0;
    background:rgba(10,20,18,0.45);
    z-index:70;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s var(--ease);
  }
  #modal-overlay.open{opacity:1;pointer-events:auto;}
  #modal-sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-radius:22px 22px 0 0;
    z-index:71;
    max-height:82vh;
    overflow-y:auto;
    padding:8px 20px calc(24px + var(--safe-bottom));
    transform:translateY(100%);
    transition:transform .32s var(--ease);
    box-shadow:0 -20px 50px -20px rgba(9,42,39,0.4);
  }
  #modal-sheet.open{transform:translateY(0);}
  #modal-sheet .modal-handle{
    width:36px;height:4px;border-radius:2px;
    background:var(--border);
    margin:10px auto 14px;
  }
  #modal-sheet h3{
    font-family:'Space Grotesk',sans-serif;
    font-size:17px;font-weight:600;margin:0 0 4px;
  }
  #modal-sheet .modal-body{font-size:13.5px;line-height:1.6;color:var(--text);}
  #modal-sheet .modal-body p{margin:8px 0;}
  #modal-sheet .modal-close{
    position:absolute;top:14px;right:16px;
    width:30px;height:30px;border-radius:50%;
    border:none;background:var(--primary-light);color:var(--primary);
    font-size:15px;cursor:pointer;
  }

  /* ---- Transition entre écrans ---- */
  .screen{animation:screenIn .32s var(--ease);}
  @keyframes screenIn{
    0%{ opacity:0; transform:translateY(10px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  /* ---- Pression des boutons (retour tactile) ---- */
  button{transition:transform .15s var(--ease), box-shadow .15s var(--ease), background .2s var(--ease);}
  button.primary{
    box-shadow:0 10px 22px -10px rgba(161,104,15,0.55);
    background-image:linear-gradient(165deg, var(--accent) 0%, var(--accent-deep) 100%);
  }
  button.primary:active{transform:scale(0.97) translateY(1px);box-shadow:0 4px 10px -6px rgba(161,104,15,0.5);}
  button.secondary:active{transform:scale(0.97);background:var(--primary-light);}
  .type-btn:active, .op-btn:active{transform:scale(0.96);}
  .type-btn, .op-btn, .card{transition:transform .15s var(--ease), border-color .2s var(--ease), background .2s var(--ease);}

  /* ---- Chiffres qui comptent ---- */
  .count-up{display:inline-block;}

  /* ---- Barre de recherche (façon WhatsApp) ---- */
  .search-wrap{position:relative;margin:4px 0 14px;}
  .search-wrap input{
    width:100%;
    padding:10px 14px 10px 36px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--bg);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--text);
  }
  .search-wrap input:focus{outline:none;border-color:var(--accent);}
  .search-wrap .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);}

  /* ---- Barre d'onglets du bas (façon WhatsApp) ---- */
  #tab-bar{
    position:fixed;
    left:0;right:0;bottom:0;
    background:#fff;
    border-top:1px solid var(--border);
    display:none;
    z-index:50;
    padding-bottom:var(--safe-bottom);
  }
  #tab-bar.visible{display:flex;}
  #tab-bar button{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 8px;
    border:none;background:none;
    color:var(--muted);
    font-family:'Inter',sans-serif;
    font-size:10.5px;
    font-weight:500;
  }
  #tab-bar button.active{color:var(--accent);}
  #tab-bar button.active .ico{color:var(--accent);}
  #tab-bar button:active{opacity:0.6;}
  body.has-tabbar .phone{padding-bottom:calc(58px + var(--safe-bottom));}

  /* ---- Icônes traits fins (remplacent les émojis dans l'UI principale) ---- */
  .ico{display:inline-block;vertical-align:-4px;flex-shrink:0;}
  .ico svg{display:block;width:100%;height:100%;}
  .menu-icon.ico{vertical-align:-3px;}

  /* ---- Tampon de confirmation (statut terminé) ---- */
  .stamp-pop{animation:stampPop .5s var(--ease);}
  @keyframes stampPop{
    0%{ transform:scale(0.5) rotate(-8deg); opacity:0; }
    60%{ transform:scale(1.08) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-c">C</div>
  <div class="splash-name">ColisSûr</div>
  <div class="splash-tag">Le tiers de confiance pour ton colis</div>
</div>

<div class="phone">
  <div class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand"><span class="ico" style="width:19px;height:19px;"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V6.5a4 4 0 0 1 8 0V9"/><rect x="4.5" y="9" width="11" height="8.5" rx="1.8"/><circle cx="10" cy="13" r="1.15" fill="currentColor" stroke="none"/></svg></span>ColisSûr</div>
      <button id="btn-menu" aria-label="Menu">&#8942;</button>
    </div>
    <div class="roles">
      <button id="btn-role-vendeur" class="active">Vendeuse</button>
      <button id="btn-role-client">Client &amp; agent</button>
    </div>
  </div>

  <div id="menu-overlay"></div>
  <div id="menu-sheet">
    <button id="menu-profil"><span class="menu-icon ico" style="width:17px;height:17px;color:var(--primary);"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3"/><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/></svg></span>Profil / mon compte</button>
    <button id="menu-parametres"><span class="menu-icon ico" style="width:17px;height:17px;color:var(--primary);"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 3.3v1.9M10 14.8v1.9M16.7 10h-1.9M5.2 10H3.3M14.7 5.3l-1.3 1.3M6.6 13.4l-1.3 1.3M14.7 14.7l-1.3-1.3M6.6 6.6 5.3 5.3"/></svg></span>Paramètres</button>
    <button id="menu-aide"><span class="menu-icon ico" style="width:17px;height:17px;color:var(--primary);"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M7.8 7.8a2.2 2.2 0 1 1 3.3 2.6c-.7.5-1.1 1-1.1 1.9"/><circle cx="10" cy="14" r="0.15" fill="currentColor" stroke-width="1.4"/></svg></span>Aide et contact</button>
  </div>

  <div id="modal-overlay"></div>
  <div id="modal-sheet">

function toBase64Unicode(str){
  var bytes = new TextEncoder().encode(str);
  var binary = '';
  for(var i = 0; i < bytes.length; i++){ binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

function fromBase64Unicode(b64){
  var binary = atob(b64);
  var bytes = new Uint8Array(binary.length);
  for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder().decode(bytes);
}

function encodeOrder(o){
  var full = {
    i:o.id, t:o.typeTransaction, p:o.produit, vt:o.vendeurTel,
    ct:o.clientTel, pr:o.prix, f:o.frais, tt:o.total,
    c:o.commission, d:o.depart, a:o.arrivee,
    s:o.statut, pl:o.pointRelais, q:o.qr,
    ac:o.agentCode, cc:o.clientCode,
    af:o.agentConfirmed, cf:o.clientConfirmed, op:o.operateur
  };
  var payload = {};
  for(var key in full){
    if(full[key] !== null && full[key] !== '' && full[key] !== false && full[key] !== undefined){
      payload[key] = full[key];
    }
  }
  return encodeURIComponent(toBase64Unicode(JSON.stringify(payload)));
}

function decodeOrder(str){
  try{
    var payload = JSON.parse(fromBase64Unicode(decodeURIComponent(str)));
    return {
      id: payload.i, typeTransaction: payload.t || 'inter_ville',
      produit: payload.p, vendeurTel: payload.vt || '', clientTel: payload.ct || '',
      prix: payload.pr, frais: payload.f,
      total: payload.tt, commission: payload.c, depart: payload.d, arrivee: payload.a,
      statut: payload.s || 'attente_paiement',
      pointRelais: payload.pl || null, qr: payload.q || null,
      agentCode: payload.ac || null, clientCode: payload.cc || null,
      agentConfirmed: !!payload.af, clientConfirmed: !!payload.cf,
      operateur: payload.op || null
    };
  } catch(e){
    return null;
  }
}

function statusRank(statut){
  var ranks = {
    attente_paiement: 0, confirmation_paiement: 1, gele: 2,
    remise_directe: 3, en_route: 3, arrive: 4, libere: 5, rembourse: 5
  };
  return ranks.hasOwnProperty(statut) ? ranks[statut] : 0;
}

function buildOrderLink(o){
  var base = window.location.href.split('?')[0].split('#')[0];
  return base + '?o=' + encodeOrder(o);
}

function openExternalLink(url){
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

    'Clique ici pour payer en sécurité : ' + lien;

  if(o.photoProduit){

function loadOrderFromLink(){
  var params = new URLSearchParams(window.location.search);
  var o = params.get('o');
  if(!o) return false;
  var decoded = decodeOrder(o);
  if(!decoded) return false;

  var saved = null;
  try{
    var raw = localStorage.getItem('cs_order_' + decoded.id);
    if(raw) saved = JSON.parse(raw);
  } catch(e){}

  if(saved && statusRank(saved.statut) >= statusRank(decoded.statut)){
    state.order = saved;
  } else {
    state.order = decoded;
  }
  state.role = 'client';
  state.fromLink = true;
  persistOrder();
  return true;
}

function loadCatalogFromLink(){
  var params = new URLSearchParams(window.location.search);
  var c = params.get('cat');
  if(!c) return false;
  var cat = decodeCatalog(c);
  if(!cat) return false;
  state.catalogBrowse = cat;
  state.role = 'client';
  return true;
}

function buyFromCatalog(itemId){
  var cat = state.catalogBrowse;
  var item = cat.items.filter(function(it){ return it.id === itemId; })[0];
  if(!item) return;

  var arrivee = cat.depart;
  if(cat.typeTransaction !== 'meme_ville'){
    var saisie = window.prompt('Ta ville de livraison :', '');
    if(!saisie || !saisie.trim()) return;
    arrivee = saisie.trim();
  }

  state.order = {
    id: genCode(),
    typeTransaction: cat.typeTransaction,
    produit: item.nom,
    vendeurTel: cat.vendeurTel,
    clientTel: '',
    prix: item.prix,
    frais: item.frais,
    commission: item.prix * commissionRate(cat.typeTransaction),
    total: item.prix + item.frais,
    depart: cat.depart,
    arrivee: arrivee,
    statut: 'attente_paiement',
    pointRelais: null,
    qr: null,
    agentCode: null,
    clientCode: null,
    agentConfirmed: false,
    clientConfirmed: false,
    operateur: null
  };
  state.catalogBrowse = null;
  state.role = 'client';
  state.fromLink = true;
  lockClientRole();
  persistOrder();
  render();
}

function persistOrder(){
  if(!state.order) return;
  try{
    localStorage.setItem('cs_order_' + state.order.id, JSON.stringify(state.order));
    if(state.role === 'vendeur' && !state.fromLink){
      localStorage.setItem('cs_vendor_active_id', state.order.id);
    }
  } catch(e){}
}

function loadVendorOrder(){
  try{
    var activeId = localStorage.getItem('cs_vendor_active_id');
    if(!activeId) return false;
    var raw = localStorage.getItem('cs_order_' + activeId);
    if(!raw) return false;
    state.order = JSON.parse(raw);
    return true;
  } catch(e){
    return false;
  }
}

function getSavedOrders(){
  var list = [];
  try{
    for(var i = 0; i < localStorage.length; i++){
      var key = localStorage.key(i);
      if(key && key.indexOf('cs_order_') === 0){
        try{ list.push(JSON.parse(localStorage.getItem(key))); } catch(e){}
      }
    }
  } catch(e){}
  return list;
}

function resumeOrder(id){
  try{
    var raw = localStorage.getItem('cs_order_' + id);
    if(!raw) return;
    state.order = JSON.parse(raw);
    state.role = 'client';
    state.fromLink = true;
    lockClientRole();
    render();
  } catch(e){}
}

    expire_vendeur: 'Non récupéré — reversé à la vendeuse',

  if(typeTransaction === 'meme_ville') return 0.03;
  if(typeTransaction === 'international') return 0.08;

// un repère visuel familier (comme WhatsApp, Instagram...).
window.addEventListener('scroll', function(){
  document.getElementById('topbar').classList.toggle('compact', window.scrollY > 8);
}, { passive: true });

// Glisser à gauche/droite pour parcourir Transaction directe / Catalogue /
// Historique, comme un carrousel — uniquement tant qu'aucune commande
// n'est en cours, pour ne jamais gêner la saisie d'un formulaire actif.
(function(){
  var startX = 0, startY = 0, tracking = false;
  var screenEl = document.getElementById('screen');
  screenEl.addEventListener('touchstart', function(e){
    if(state.order || state.role !== 'vendeur') { tracking = false; return; }
    tracking = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  screenEl.addEventListener('touchend', function(e){
    if(!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6){
      swipeVendorScreen(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

function updateVault(){
  var ring = document.getElementById('ring');
  var label = document.getElementById('stage-label');
  var sub = document.getElementById('stage-sub');
  var steps = document.querySelectorAll('.step');
  var o = state.order;

  var stageIndex = -1;
  var icon = '&#128274;';
  var text = 'Aucune commande';
  var subtext = 'Crée une commande pour commencer';
  var color = '';

  if(o){
    if(o.statut === 'attente_paiement'){ stageIndex=0; icon='&#128273;'; text='Créée'; subtext='En attente du paiement du client'; }
    else if(o.statut === 'confirmation_paiement'){ stageIndex=0; icon='&#128273;'; text='Confirmation en cours'; subtext='La cliente confirme sur Mobile Money'; }
    else if(o.statut === 'gele'){ stageIndex=1; icon='&#128274;'; text='Gelée'; subtext='Argent en sécurité, en attente de dépôt'; }
    else if(o.statut === 'remise_directe'){ stageIndex=2; icon='&#128274;'; text='Remise directe'; subtext='En attente de vérification par la cliente'; }
    else if(o.statut === 'en_route'){ stageIndex=2; icon='&#128274;'; text='En route'; subtext='Colis en transit vers ' + o.arrivee; }
    else if(o.statut === 'arrive'){
      stageIndex=2; icon='&#128274;';
      if(!o.agentConfirmed){ text='Arrivée'; subtext='En attente de confirmation de l\'agent'; }
      else { text='Remise confirmée'; subtext='En attente de vérification par la cliente'; }
    }
    else if(o.statut === 'libere'){ stageIndex=3; icon='&#128275;'; text='Libérée'; subtext='Paiement envoyé à la vendeuse'; color='ok'; }
    else if(o.statut === 'rembourse'){ stageIndex=3; icon='&#10060;'; text='Remboursée'; subtext='Colis refusé, client remboursé'; color='bad'; }
    else if(o.statut === 'expire_vendeur'){ stageIndex=3; icon='&#9203;'; text='Non récupéré'; subtext='Délai dépassé, fonds reversés à la vendeuse'; color='bad'; }
    else if(o.statut === 'expire_client'){ stageIndex=3; icon='&#9203;'; text='Colis non envoyé'; subtext='Délai dépassé, fonds remboursés à la cliente'; color='bad'; }
  }

  ring.innerHTML = icon;
  ring.style.borderColor = color === 'bad' ? 'var(--danger)' : (color === 'ok' ? 'var(--success)' : 'var(--primary)');
  ring.style.color = color === 'bad' ? 'var(--danger)' : (color === 'ok' ? 'var(--success)' : 'var(--primary)');
  label.textContent = text;
  sub.textContent = subtext;

  steps.forEach(function(s){
    var i = parseInt(s.getAttribute('data-i'));
    s.className = 'step';
    if(i <= stageIndex){
      if(i === 3 && color === 'bad') s.classList.add('final-bad');
      else if(i === 3 && color === 'ok') s.classList.add('final-ok');
      else s.classList.add('done');
    }
  });

  var balanceBtn = document.getElementById('btn-view-balance');
  if(o && fundsFrozen(o.statut)){
    balanceBtn.style.display = 'block';
    balanceBtn.onclick = showBalance;
  } else {
    balanceBtn.style.display = 'none';
  }

  var cancelBtn = document.getElementById('btn-cancel-any');
  var terminalStatuses = ['libere', 'rembourse', 'expire_vendeur', 'expire_client'];
  var paidStatuses = ['gele', 'remise_directe', 'en_route', 'arrive'];

  var shortcutBtn = document.getElementById('btn-shortcut-done');
  if(o && state.role === 'vendeur' && !state.showBalance && paidStatuses.indexOf(o.statut) !== -1){
    shortcutBtn.style.display = 'block';
    shortcutBtn.onclick = function(){
      if(window.confirm('Confirmer que la cliente a bien reçu son colis et validé sur son téléphone ? La transaction va être marquée comme terminée.')){
        markVendeurConfirme(true);
      }
    };
  } else {
    shortcutBtn.style.display = 'none';
  }

  if(o && state.role === 'vendeur' && !state.showBalance && terminalStatuses.indexOf(o.statut) === -1){
    cancelBtn.style.display = 'block';
    cancelBtn.onclick = function(){
      if(window.confirm('Annuler cette commande ? Cette action est irréversible dans cette démo.')){
        state.order = null;
        try{ localStorage.removeItem('cs_vendor_active_id'); } catch(e){}
        render();
      }
    };
  } else {
    cancelBtn.style.display = 'none';
  }
}

function fundsFrozen(statut){
  return statut === 'gele' || statut === 'en_route' || statut === 'arrive' || statut === 'remise_directe';
}

function showBalance(){
  state.showBalance = true;
  render();
}

function hideBalance(){
  state.showBalance = false;
  render();
}

function screen(html){
  var el = document.getElementById('screen');
  el.innerHTML = html;
  el.classList.remove('screen');
  void el.offsetWidth; // force le navigateur à "oublier" l'animation précédente
  el.classList.add('screen');
  animateCountUps(el);
}

// Fait défiler les montants en FCFA à l'affichage, au lieu de les figer.
function animateCountUps(container){
  container.querySelectorAll('[data-count]').forEach(function(node){
    var target = parseInt(node.getAttribute('data-count'), 10);
    if(isNaN(target)){ return; }
    var duration = 650;
    var start = null;
    function step(ts){
      if(!start) start = ts;
      var progress = Math.min(1, (ts - start) / duration);
      var eased = 1 - Math.pow(1 - progress, 3);
      node.textContent = fcfa(Math.round(target * eased));
      if(progress < 1) requestAnimationFrame(step);
      else node.textContent = fcfa(target);
    }
    requestAnimationFrame(step);
  });
}

function render(){
  if(state.order) checkDeadlineExpired(state.order);
  updateVault();
  persistOrder();
  if(state.showBalance && state.order && fundsFrozen(state.order.statut)){
    renderBalance();
    return;
  }
  if(state.role === 'vendeur') renderVendeur();
  else renderClient();
  updateTabBar();
}

// La barre du bas ne sert que tant qu'aucune commande n'est en cours
// chez la vendeuse — une fois une commande ouverte, on la masque pour
// ne pas gêner le suivi de cette commande précise.
function updateTabBar(){
  var show = state.role === 'vendeur' && !state.order;
  document.getElementById('tab-bar').classList.toggle('visible', show);
  document.body.classList.toggle('has-tabbar', show);
  if(!show) return;
  var current = state.vendorMode || '';
  document.querySelectorAll('#tab-bar button[data-mode]').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-mode') === current);
  });
}

// Les 4 "pages" que l'on peut parcourir au doigt, dans l'ordre, quand
// aucune commande n'est en cours : le choix, puis les 3 destinations.
var VENDOR_SWIPE_PAGES = [null, 'ecommerce', 'marketplace', 'history'];
function vendorSwipeIndex(){
  var i = VENDOR_SWIPE_PAGES.indexOf(state.vendorMode || null);
  return i === -1 ? 0 : i;
}
function swipeVendorScreen(dir){
  if(state.order || state.role !== 'vendeur') return;
  var next = vendorSwipeIndex() + dir;
  if(next < 0 || next >= VENDOR_SWIPE_PAGES.length) return;
  state.vendorMode = VENDOR_SWIPE_PAGES[next];
  render();
}
function swipeDots(){
  var i = vendorSwipeIndex();
  var dots = VENDOR_SWIPE_PAGES.map(function(_, idx){
    return '<span style="width:' + (idx === i ? '18px' : '6px') + ';height:6px;border-radius:3px;background:' + (idx === i ? 'var(--accent)' : 'var(--border)') + ';display:inline-block;transition:width .25s var(--ease), background .25s var(--ease);"></span>';
  }).join('');
  return '<div style="display:flex;gap:5px;justify-content:center;margin:4px 0 14px;">' + dots + '</div>';
}

function createOrder(){
  var t = state.draft.type || 'inter_ville';
  var produit = document.getElementById('f-produit').value.trim();
  var vendeurTel = document.getElementById('f-vendeur-tel').value.trim();
  var prix = parseFloat(document.getElementById('f-prix').value);
  var fraisRaw = document.getElementById('f-frais').value;
  var frais = fraisRaw === '' ? NaN : parseFloat(fraisRaw);
  var err = document.getElementById('f-err');
  var depart, arrivee;

  if(t === 'meme_ville'){
    var ville = document.getElementById('f-ville').value.trim();
    depart = ville;
    arrivee = ville;
    if(!produit || !vendeurTel || !prix || prix <= 0 || isNaN(frais) || frais < 0 || !ville){
      err.style.display = 'block';
      return;
    }
  } else {
    depart = document.getElementById('f-depart').value.trim();
    arrivee = document.getElementById('f-arrivee').value.trim();
    if(!produit || !vendeurTel || !prix || prix <= 0 || isNaN(frais) || frais < 0 || !depart || !arrivee){
      err.style.display = 'block';
      return;
    }
  }
  err.style.display = 'none';

  state.order = {
    id: genCode(),
    typeTransaction: t,
    produit: produit,
    vendeurTel: vendeurTel.replace(/[^0-9]/g, ''),
    clientTel: '',
    prix: prix,
    frais: frais,
    commission: prix * commissionRate(t),
    total: prix + frais,
    depart: depart,
    arrivee: arrivee,
    statut: 'attente_paiement',
    pointRelais: null,
    qr: null,
    agentCode: null,
    clientCode: null,
    agentConfirmed: false,
    clientConfirmed: false,
    operateur: null,
    photoProduit: state.draft.photoProduit || null
  };
  saveVendorProfile({ tel: state.order.vendeurTel, boutique: (getVendorProfile() || {}).boutique || '' });
  addToVendorHistory(state.order.id);
  state.draft = { type: 'inter_ville' };
  render();
}

// ---- Historique des commandes de la vendeuse ----
function addToVendorHistory(id){
  try{
    var ids = JSON.parse(localStorage.getItem('cs_vendor_order_ids') || '[]');
    if(ids.indexOf(id) === -1){
      ids.unshift(id);
      localStorage.setItem('cs_vendor_order_ids', JSON.stringify(ids));
    }
  } catch(e){}
}
function getVendorHistory(){
  try{
    var ids = JSON.parse(localStorage.getItem('cs_vendor_order_ids') || '[]');
    return ids.map(function(id){
      try{ return JSON.parse(localStorage.getItem('cs_order_' + id)); }
      catch(e){ return null; }
    }).filter(function(o){ return o; });
  } catch(e){ return []; }
}
function resumeVendorOrder(id){
  try{
    var raw = localStorage.getItem('cs_order_' + id);
    if(!raw) return;
    state.order = JSON.parse(raw);
    state.role = 'vendeur';
    localStorage.setItem('cs_vendor_active_id', id);
    render();
  } catch(e){}
}
function removeFromVendorHistory(id, deleteOrderToo){
  try{
    var ids = JSON.parse(localStorage.getItem('cs_vendor_order_ids') || '[]');
    ids = ids.filter(function(x){ return x !== id; });
    localStorage.setItem('cs_vendor_order_ids', JSON.stringify(ids));
    if(deleteOrderToo){
      localStorage.removeItem('cs_order_' + id);
      var activeId = localStorage.getItem('cs_vendor_active_id');
      if(activeId === id) localStorage.removeItem('cs_vendor_active_id');
    }
  } catch(e){}
}

function renderVendorHistory(q){
  q = (q || '').toLowerCase().trim();
  var orders = getVendorHistory();

    orders = orders.filter(function(o){

  screen(
    '<button class="secondary" id="btn-back-mode" style="margin-bottom:10px;">&larr; Retour</button>' +
    swipeDots() +
    '<h2>Historique de mes commandes</h2>' +
    '<p class="lead">Toutes les commandes que tu as créées, tous types confondus.</p>' +
    '<div class="search-wrap">' + ico('search', 16) + '<input id="f-search-history" placeholder="Rechercher un produit ou un code..." value="' + q + '"></div>' +
    list
  );
  document.getElementById('btn-back-mode').onclick = function(){ state.vendorMode = null; render(); };

  searchInput.oninput = function(){ renderVendorHistory(searchInput.value); };

  document.querySelectorAll('#screen [data-open]').forEach(function(el){
    el.onclick = function(){ resumeVendorOrder(el.getAttribute('data-open')); };

    btn.onclick = function(e){
      e.stopPropagation();
      var id = btn.getAttribute('data-delete');
      if(window.confirm('Retirer la commande ' + id + ' de ton historique ? Ça ne rembourse ni n\'annule rien, ça efface juste la trace sur ton téléphone.')){
        removeFromVendorHistory(id, true);
        render();
      }
    };
  });

// Stats réelles de la vendeuse, à partir de son propre historique —
// pas de triche possible : seules les commandes réellement "libérées"
// (confirmées par une cliente) comptent.
var BADGE_VERIFIE_SEUIL = 3;
function getVendorStats(){
  var orders = getVendorHistory();
  var ventesReussies = orders.filter(function(o){ return o.statut === 'libere'; }).length;
  var notes = orders.filter(function(o){ return o.avisNote; }).map(function(o){ return o.avisNote; });
  var avgNote = notes.length ? (notes.reduce(function(a,b){ return a+b; }, 0) / notes.length) : 0;
  return { ventesReussies: ventesReussies, avgNote: avgNote, nbAvis: notes.length, verifiee: ventesReussies >= BADGE_VERIFIE_SEUIL };
}

function encodeCatalog(cat){
  var stats = getVendorStats();
  var payload = {
    vt: cat.vendeurTel, d: cat.depart, t: cat.typeTransaction, b: cat.boutique,
    vn: stats.ventesReussies, an: Math.round(stats.avgNote * 10), ac: stats.nbAvis,
    items: cat.items.map(function(it){ return { i: it.id, n: it.nom, p: it.prix, f: it.frais, ic: it.icone || undefined }; })
  };
  return encodeURIComponent(toBase64Unicode(JSON.stringify(payload)));
}
function decodeCatalog(str){
  try{
    var payload = JSON.parse(fromBase64Unicode(decodeURIComponent(str)));
    return {
      vendeurTel: payload.vt || '', depart: payload.d || '', typeTransaction: payload.t || 'inter_ville',
      boutique: payload.b || 'Boutique ColisSûr',
      ventesReussies: payload.vn || 0, avgNote: (payload.an || 0) / 10, nbAvis: payload.ac || 0,
      items: (payload.items || []).map(function(it){
        return { id: it.i, nom: it.n, prix: it.p, frais: it.f, icone: it.ic || null };
      })
    };
  } catch(e){ return null; }
}
function trustBadgeHtml(ventesReussies, avgNote, nbAvis){
  var parts = [];
  if(ventesReussies >= BADGE_VERIFIE_SEUIL){
    parts.push('<span style="display:inline-flex;align-items:center;gap:4px;background:var(--success-light);color:var(--success);padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:600;">' +
      '<span class="ico" style="width:13px;height:13px;"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg></span>Vendeuse vérifiée</span>');
  }
  if(ventesReussies > 0){
    parts.push('<span class="muted-small">' + ventesReussies + ' vente(s) réussie(s)</span>');
  }
  if(nbAvis > 0){
    parts.push('<span class="muted-small">' + avgNote.toFixed(1) + ' &#9733; (' + nbAvis + ' avis)</span>');
  }
  return parts.length ? '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 2px;">' + parts.join('') + '</div>' : '';
}

// ============================================================
// POINTS D'ACCROCHE API DE PAIEMENT (CamPay ou équivalent)
// ============================================================
// IMPORTANT : ces deux fonctions ne font AUCUN vrai appel réseau.
// Une clé API ne doit JAMAIS être mise dans du code qui tourne sur
// le téléphone du client — n'importe qui peut l'extraire en ouvrant
// le code source. Ces appels doivent partir de TON PROPRE SERVEUR,
// qui lui seul connaît la clé secrète, jamais du téléphone.
//
// Le flux réel serait :
// Téléphone → ton serveur (sans clé exposée) → API CamPay (avec la clé)
//
// Ci-dessous, la forme exacte des appels CamPay (vérifiée dans leur
// documentation), à titre de modèle pour toi ou un développeur plus tard.

function notifyEscrowCollecte(o){
  if(!BACKEND_URL){
    console.log('[Simulation] Signal envoyé : encaisser ' + o.total + ' FCFA, référence ' + o.id);
    return;
  }
  fetch(BACKEND_URL + '/api/collect', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      amount: o.total,
      phone: o.clientTel,
      description: 'ColisSur ' + o.produit,
      reference: o.id
    })
  }).then(function(res){ return res.json(); })
    .then(function(data){ console.log('Collecte CamPay :', data); })
    .catch(function(err){ console.error('Erreur collecte CamPay :', err); });
}

function notifyEscrowLibere(o){
  var net = o.prix - o.commission;
  if(!BACKEND_URL){
    console.log('[Simulation] Signal envoyé : reverser ' + net + ' FCFA à ' + o.vendeurTel + ', référence ' + o.id);
    return;
  }
  fetch(BACKEND_URL + '/api/release', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      amount: net,
      phone: o.vendeurTel,
      description: 'Paiement colis ' + o.produit,
      reference: o.id
    })
  }).then(function(res){ return res.json(); })
    .then(function(data){ console.log('Libération CamPay :', data); })
    .catch(function(err){ console.error('Erreur libération CamPay :', err); });
}

function bindCancel(){
  var b = document.getElementById('btn-cancel');
  if(b) b.onclick = function(){ state.order = null; render(); };
}

function depositPackage(){
  var relais = document.getElementById('f-relais').value.trim();
  var err = document.getElementById('f-relais-err');
  if(!relais){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  state.order.pointRelais = relais;
  state.order.statut = 'en_route';
  if(state.order.clientTel){
    notifyClientEnRoute(state.order);
  }
  render();
}

function remiseDirecte(){
  state.order.clientCode = String(Math.floor(1000 + Math.random()*9000));
  state.order.agentConfirmed = true;
  state.order.statut = 'remise_directe';
  render();
}

function markArrived(){
  state.order.qr = 'QR-' + Math.floor(100000 + Math.random()*900000);
  state.order.agentCode = String(Math.floor(1000 + Math.random()*9000));
  state.order.clientCode = String(Math.floor(1000 + Math.random()*9000));
  state.order.statut = 'arrive';
  state.order.deadline = Date.now() + (3 * 24 * 60 * 60 * 1000);
  if(state.order.clientTel){
    notifyClientArrive(state.order);
  }
  render();
}

function checkDeadlineExpired(o){
  if(o.statut === 'arrive' && o.deadline && Date.now() > o.deadline && !o.clientConfirmed){
    o.statut = 'expire_vendeur';
    persistOrder();
    return true;
  }
  if(o.statut === 'gele' && o.deadlineDepot && Date.now() > o.deadlineDepot){
    o.statut = 'expire_client';
    persistOrder();
    return true;
  }
  return false;
}

function markPaiementRecu(){
  if(!state.order.clientTel){
    var tel = window.prompt('Numéro WhatsApp de la cliente (pour pouvoir la prévenir aux prochaines étapes) :', '');
    if(tel && tel.trim()){
      state.order.clientTel = tel.trim().replace(/[^0-9]/g, '');
    }
  }
  state.order.statut = 'gele';
  state.order.deadlineDepot = Date.now() + (1 * 24 * 60 * 60 * 1000);
  notifyEscrowCollecte(state.order);
  render();
}

function markVendeurConfirme(conforme){
  state.order.statut = conforme ? 'libere' : 'rembourse';
  if(conforme) notifyEscrowLibere(state.order);
  render();
}

function newOrder(){
  state.order = null;
  state.draft = { type: 'inter_ville' };
  try{ localStorage.removeItem('cs_vendor_active_id'); } catch(e){}
  render();
}

      '<span class="badge bad">&#9203; Délai de retrait dépassé</span>' +
      '<h2>Tu n\'as pas récupéré ton colis à temps</h2>' +
      '<p class="lead">Plus de 3 jours se sont écoulés depuis l\'arrivée du colis à ' + o.pointRelais + '. Les fonds ont été automatiquement reversés à la vendeuse. Contacte-la directement pour organiser une récupération tardive de ton colis.</p>'
    );
    return;
  }

  if(o.statut === 'expire_client'){
    screen(
      '<span class="badge ok">&#9203; Colis jamais envoyé</span>' +
      '<h2>Tu as été remboursée</h2>' +
      '<p class="lead">La vendeuse n\'a pas déposé le colis dans les 24h suivant ton paiement. Les ' + fcfa(o.total) + ' t\'ont été automatiquement rendus.</p>'
    );
    return;
  }
}

function selectOperator(op){
  var telInput = document.getElementById('f-tel');
  if(telInput) state.order.telDraft = telInput.value;
  state.order.operateur = op;
  render();
}

function payOrder(){
  var tel = document.getElementById('f-tel').value.trim();
  var clientTel = document.getElementById('f-client-tel').value.trim();
  var telErr = document.getElementById('f-tel-err');
  var opErr = document.getElementById('f-op-err');
  var clientTelErr = document.getElementById('f-client-tel-err');
  var ok = true;
  if(!state.order.operateur){
    opErr.style.display = 'block';
    ok = false;
  } else {
    opErr.style.display = 'none';
  }
  if(!tel){
    telErr.style.display = 'block';
    ok = false;
  } else {
    telErr.style.display = 'none';
  }
  if(!clientTel){
    clientTelErr.style.display = 'block';
    ok = false;
  } else {
    clientTelErr.style.display = 'none';
  }
  if(!ok) return;
  state.order.telDraft = tel;
  state.order.clientTel = clientTel.replace(/[^0-9]/g, '');
  state.order.statut = 'confirmation_paiement';
  render();
}

function confirmPinPayment(){
  var pin = document.getElementById('f-pin').value.trim();
  var err = document.getElementById('f-pin-err');
  if(pin.length < 4){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  state.order.statut = 'gele';
  state.order.deadlineDepot = Date.now() + (1 * 24 * 60 * 60 * 1000);
  notifyEscrowCollecte(state.order);
  render();
}

function confirmAgentCode(){
  var input = document.getElementById('f-code-agent').value.trim();
  var err = document.getElementById('f-code-agent-err');
  if(input !== state.order.agentCode){
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';
  state.order.agentConfirmed = true;
  render();
}

function handlePhotoCapture(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    state.photoDraft = ev.target.result;
    var preview = document.getElementById('photo-preview');
    if(preview){
      preview.innerHTML = '<img src="' + ev.target.result + '" style="width:100%;border-radius:12px;margin:8px 0;" alt="Photo du colis">';
    }
  };
  reader.readAsDataURL(file);
}

// Réduit une photo avant de la garder en mémoire (les photos brutes d'un
// téléphone récent font 2 à 5 Mo — bien trop pour tenir dans le stockage
// local une fois qu'on en accumule plusieurs commandes).
function compressImageFile(file, callback){
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxDim = 900;
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function handleProductPhotoCapture(e){
  var file = e.target.files[0];
  if(!file) return;
  compressImageFile(file, function(dataUrl){
    state.draft.photoProduit = dataUrl;
    var preview = document.getElementById('product-photo-preview');
    if(preview){
      preview.innerHTML = '<img src="' + dataUrl + '" style="width:100%;border-radius:12px;margin:8px 0;" alt="Photo du produit">' +
        '<button type="button" class="secondary" id="btn-remove-photo" style="margin-bottom:10px;">Retirer la photo</button>';
      document.getElementById('btn-remove-photo').onclick = function(){
        state.draft.photoProduit = null;
        preview.innerHTML = '';
      };
    }
  });
}

function checkClientCode(){
  var input = document.getElementById('f-code-client').value.trim();
  var err = document.getElementById('f-code-client-err');
  if(input !== state.order.clientCode){
    err.style.display = 'block';
    return false;
  }
  err.style.display = 'none';
  return true;
}

function markConform(){
  if(!checkClientCode()) return;
  state.order.clientConfirmed = true;
  if(state.photoDraft) state.order.photoColis = state.photoDraft;
  state.order.statut = 'libere';
  notifyEscrowLibere(state.order);
  render();
}

function markRefused(){
  if(!checkClientCode()) return;
  state.order.clientConfirmed = true;
  if(state.photoDraft) state.order.photoColis = state.photoDraft;
  state.order.statut = 'rembourse';
  render();
}

function lockClientRole(){
  state.roleLocked = true;
  var btnV = document.getElementById('btn-role-vendeur');
  if(btnV) btnV.style.display = 'none';
  var btnC = document.getElementById('btn-role-client');
  if(btnC) btnC.classList.add('active');
}

function lockVendorRole(){
  var btnC = document.getElementById('btn-role-client');
  if(btnC) btnC.style.display = 'none';
}

// ---- Menu "⋯" ----

  document.getElementById('menu-overlay').classList.toggle('open', open);

}

  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-sheet').classList.add('open');

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-sheet').classList.remove('open');
}

function openProfilModal(){
  toggleMenu(false);
  var p = getVendorProfile() || {};
  var historyCount = getVendorHistory().length;
  var s = getVendorStats();
  var badgeProgress = s.verifiee
    ? '<p style="color:var(--success);margin-top:10px;">&#10003; Félicitations, tu as le badge "Vendeuse vérifiée" !</p>'
    : '<p class="muted-small" style="margin-top:10px;">Encore ' + (BADGE_VERIFIE_SEUIL - s.ventesReussies) + ' vente(s) réussie(s) avant d\'obtenir le badge "Vendeuse vérifiée", visible par tes clientes sur ton catalogue.</p>';

    '<p><b>Numéro WhatsApp :</b> ' + (p.tel || '<span style="color:var(--muted);">Pas encore renseigné</span>') + '</p>' +
    '<p><b>Commandes créées :</b> ' + historyCount + '</p>' +
    '<p><b>Ventes réussies :</b> ' + s.ventesReussies + '</p>' +
    (s.nbAvis ? '<p><b>Note moyenne :</b> ' + s.avgNote.toFixed(1) + ' &#9733; (' + s.nbAvis + ' avis)</p>' : '') +
    badgeProgress +
    '<p style="color:var(--muted);margin-top:14px;">Ces informations sont gardées sur ton téléphone et se remplissent automatiquement dès ta première commande ou ton premier catalogue.</p>'

function openParametresModal(){
  toggleMenu(false);
  openModal('Paramètres',
    '<p><b>Connexion au paiement :</b> ' + (BACKEND_URL ? '<span style="color:var(--success);">Connectée à CamPay</span>' : '<span style="color:var(--muted);">Mode simulation (pas encore de serveur relié)</span>') + '</p>' +
    '<p><b>Version de l\'appli :</b> ColisSûr pilote</p>' +
    '<p style="color:var(--muted);margin-top:14px;">Pour effacer toutes les données gardées sur ce téléphone (commandes, catalogue, profil) :</p>' +
    '<button class="secondary" id="btn-reset-data" style="margin-top:4px;color:var(--danger);border-color:var(--danger);">Effacer les données de cet appareil</button>'
  );
  var btn = document.getElementById('btn-reset-data');
  if(btn){
    btn.onclick = function(){
      if(window.confirm('Ça efface toutes les commandes, le catalogue et le profil gardés sur ce téléphone, sans possibilité de revenir en arrière. Continuer ?')){
        localStorage.clear();
        window.location.reload();
      }
    };
  }
}

// ---- Avis avec étoiles (cliente vers vendeuse) ----
// Comme la photo : reste sur le téléphone de la cliente tant qu'elle ne
// l'envoie pas elle-même — donc on prépare directement le message WhatsApp.
state.avisDraft = state.avisDraft || 0;
function avisBlock(o){
  if(o.avisNote){
    return '<div class="card" style="margin-top:14px;">' +
      '<div class="line"><span>Ton avis</span><span>' + '&#9733;'.repeat(o.avisNote) + '&#9734;'.repeat(5 - o.avisNote) + '</span></div>' +
      (o.avisCommentaire ? '<p class="muted-small" style="margin-top:4px;">"' + o.avisCommentaire + '"</p>' : '') +
    '</div>';
  }
  var stars = [1,2,3,4,5].map(function(n){
    return '<button type="button" data-star="' + n + '" style="background:none;border:none;padding:2px;">' +
      '<span class="ico" style="width:28px;height:28px;color:' + (n <= state.avisDraft ? 'var(--accent)' : 'var(--border)') + ';">' +
      '<svg viewBox="0 0 20 20" fill="' + (n <= state.avisDraft ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">' + ICONS.star + '</svg></span></button>';
  }).join('');
  return '<div class="card" style="margin-top:14px;">' +
    '<div class="line"><span><b>Comment s\'est passée la commande ?</b></span></div>' +
    '<div style="display:flex;justify-content:center;gap:2px;margin:6px 0 10px;">' + stars + '</div>' +
    '<textarea id="f-avis-commentaire" placeholder="Un commentaire pour la vendeuse (optionnel)" style="width:100%;min-height:60px;padding:10px;border-radius:10px;border:1px solid var(--border);font-family:\'Inter\',sans-serif;font-size:13px;"></textarea>' +
    '<button class="primary" id="btn-envoyer-avis" style="margin-top:10px;">Envoyer mon avis</button>' +
  '</div>';
}
function bindAvisBlock(o){
  if(o.avisNote) return;
  document.querySelectorAll('#screen [data-star]').forEach(function(btn){
    btn.onclick = function(){
      state.avisDraft = parseInt(btn.getAttribute('data-star'), 10);
      render();
    };
  });
  var btnSend = document.getElementById('btn-envoyer-avis');
  if(btnSend){
    btnSend.onclick = function(){
      if(!state.avisDraft){ window.alert('Choisis au moins une étoile avant d\'envoyer.'); return; }
      o.avisNote = state.avisDraft;
      o.avisCommentaire = document.getElementById('f-avis-commentaire').value.trim();
      state.avisDraft = 0;
      persistOrder();
      if(o.vendeurTel) notifyVendeurAvis(o);
      render();
    };
  }
}
function notifyVendeurAvis(o){
  var texte = '&#9733; Avis sur ta commande ' + o.id + ' (' + o.produit + ') : ' +
    o.avisNote + '/5' + (o.avisCommentaire ? '\n"' + o.avisCommentaire + '"' : '');
  texte = texte.replace('&#9733;', '⭐');
  openExternalLink('https://wa.me/' + o.vendeurTel + '?text=' + encodeURIComponent(texte));
}

// Pas une vraie IA (ça demanderait un serveur + une clé API payante,
// comme pour CamPay) — un assistant local simple qui cherche dans une
// liste de questions fréquentes par mots-clés. Honnête, mais utile.
var FAQ = [
  { mots: ['marche','fonctionne','fonctionnement','comment'], q: 'Comment ça marche ?', r: 'La cliente paie, l\'argent reste bloqué (gelé), la vendeuse envoie le colis, et l\'argent n\'est reversé à la vendeuse qu\'une fois la cliente satisfaite.' },
  { mots: ['commission','pourcentage','frais colissur','prix colissur'], q: 'Quelle est la commission de ColisSûr ?', r: '3 % pour une vente même ville, 5 % entre villes, 8 % entre pays — prélevée sur la part de la vendeuse, jamais ajoutée au prix payé par la cliente.' },
  { mots: ['annuler','rembours','retour'], q: 'Comment annuler ou se faire rembourser ?', r: 'Tant que l\'argent n\'est pas libéré, le bouton d\'annulation est disponible à tout moment. Si le colis n\'est jamais envoyé sous 24h, le remboursement est automatique.' },
  { mots: ['code','perdu','retrouve','retrouver'], q: 'J\'ai perdu le code d\'une commande ?', r: 'Le code (CS-XXXX) est visible dans l\'historique de tes commandes, accessible depuis l\'onglet Historique en bas.' },
  { mots: ['photo','image'], q: 'À quoi sert la photo ?', r: 'La photo du produit (à la création) aide la cliente à se décider. La photo du colis ouvert (à la réception) sert de preuve en cas de désaccord.' },
  { mots: ['catalogue','marketplace','boutique'], q: 'Comment fonctionne le catalogue ?', r: 'Tu crées ta boutique une fois, tu ajoutes tes produits, puis tu partages le lien de ton catalogue. La cliente qui l\'ouvre peut acheter directement.' },
  { mots: ['point relais','agent','relais'], q: 'Le rôle du point relais ?', r: 'L\'agent du point relais confirme le dépôt du colis par la vendeuse, puis son arrivée — avant que la cliente ne vienne le récupérer et confirme.' },
  { mots: ['litige','probleme','conforme','pas conforme'], q: 'Et en cas de litige ?', r: 'Si le colis reçu ne correspond pas à la description, la cliente peut refuser au moment de la confirmation — l\'argent est alors remboursé plutôt que libéré.' }
];
function renderFaqResults(q){
  q = (q || '').toLowerCase().trim();
  var matches = !q ? FAQ : FAQ.filter(function(item){
    return item.q.toLowerCase().indexOf(q) !== -1 || item.mots.some(function(m){ return m.indexOf(q) !== -1 || q.indexOf(m) !== -1; });
  });
  var html = matches.length ? matches.map(function(item){
    return '<p><b>' + item.q + '</b><br>' + item.r + '</p>';
  }).join('') : '<p style="color:var(--muted);">Aucune réponse trouvée pour "' + q + '". Essaie un autre mot, ou contacte directement la personne concernée via WhatsApp.</p>';
  document.getElementById('faq-results').innerHTML = html;
}
function openAideModal(){
  toggleMenu(false);
  openModal('Aide et contact',
    '<div class="search-wrap">' + ico('search', 16) + '<input id="f-faq-search" placeholder="Pose ta question (ex. commission, annuler...)"></div>' +
    '<div id="faq-results"></div>' +
    '<p style="color:var(--muted);margin-top:14px;">Ceci est un assistant local, pas une vraie IA — il cherche juste dans une liste de réponses toutes faites. ColisSûr est en phase pilote, signale tout problème rencontré.</p>'
  );
  renderFaqResults('');
  document.getElementById('f-faq-search').oninput = function(e){ renderFaqResults(e.target.value); };
}

var testMode = urlParams.get('test') === '1';

} else if(loadCatalogFromLink()){

}
